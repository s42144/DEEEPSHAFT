function buyItem(kind, id, el){
  const E = earningsCfg();
  let it = null, ton = 0;
  if (kind === 'miner'){ it = CFG.miners.find(x => x.id === id); ton = it && it.costTon || 0; }
  else if (kind === 'gear'){ it = CFG.gear.find(x => x.id === id); ton = it && it.costTon || 0; }
  else if (kind === 'gems'){ it = CFG.gemPacks.find(x => x.id === id); ton = it && it.priceTon || 0; }
  if (!it) return;
  // TON-only purchases when earnings system is enabled
  if (E.tonOnlyPurchases !== false){
    if (ton <= 0){ toast('This item can only be purchased with TON', 'err', 'ton'); sfx('err'); return; }
    sheetPayment({ kind, id, amountTon: ton, label: it.label || it.name, gems: kind === 'gems' ? it.gems : 0 });
    return;
  }
  // Fallback: legacy ore/gem path (only when tonOnlyPurchases is disabled by control panel)
  const O = CFG.currency.ore.name, G = CFG.currency.gem.name;
  let ore = 0, gem = 0;
  if (kind === 'miner'){ ore = it.costOre||0; gem = it.costGem||0; }
  else if (kind === 'gear'){ ore = it.costOre||0; gem = it.costGem||0; }
  if (ton > 0){ sheetPayment({ kind, id, amountTon: ton, label: it.label || it.name, gems: kind === 'gems' ? it.gems : 0 }); return; }
  if (ST.ore < ore){ toast('Not enough ' + O, 'err', 'ore'); sfx('err'); return; }
  if (gem > 0 && ST.gems < gem){ toast('Not enough ' + G, 'err', 'gem'); sfx('err'); return; }
  ST.ore -= ore; ST.gems -= gem;
  grantItem(kind, id);
  ST.stats.buys++;
  recordPay({ kind, id, label: it.name }, ore ? 'ore' : 'gem', 0, { status:'paid', note: (ore ? fmt(ore) + ' ' + O : '') + (gem ? (ore ? ' + ' : '') + fmt(gem) + ' ' + G : '') });
  sfx('buy'); hapOk(); confettiEl(el, 50);
  save(); renderNav(); checkAch();
}
function logEvent(type, data){
  const arr = LS.get('cp_events', []);
  arr.unshift({ ts: Date.now(), type, userId: USER?USER.id:0, userName: USER?USER.name:'Guest', data });
  LS.set('cp_events', arr.slice(0, 200));
}

/* ================================ 16. ENGINE ================================== */
function spawnVein(f){
  const md = MAP();
  const pool = (md.loots && md.loots.length) ? md.loots : ['stone'];
  const hp = CFG.mining.veinHPBase * md.hpMult;
  f.vein = { type: pool[ri(0, pool.length-1)], hp, hpMax: hp };
  f.respawnAt = 0;
}
function breakVein(f, i){
  const md = MAP();
  const val = CFG.mining.veinValueBase * md.mult * (0.8 + Math.random()*0.5) * (1 + gearVal('bonusLoot'));
  const t = f.vein.type;
  ST.ore += val; ST.stats.mined += val; ST.stats.veins++;
  ST.xp += val * (CFG.economy.xpPerOre || 0.05);
  FEED.unshift({ t, val, ts: Date.now() }); FEED = FEED.slice(0, 8);
  if (VIEW === 'mine'){
    floatOre(i, val);
    const fr = $('#feedRow'); if (fr) fr.innerHTML = feedHTML();
  }
  if (Math.random() < (CFG.mining.gemDropChance||0)){
    const gm = CFG.mining.gemDropAmount || [1,1];
    const g = ri(gm[0], gm[1]);
    ST.gems += g;
    if (VIEW === 'mine') toast('+' + g + ' ' + CFG.currency.gem.name + ' found in the vein', 'gold', 'gem');
  }
  f.vein = null;
  f.respawnAt = Date.now() + ri(CFG.mining.respawnMin||6, CFG.mining.respawnMax||16) * 1000;
  checkLevel();
}
function checkLevel(){
  let up = false;
  while (ST.xp >= levelNeed(ST.level)){
    ST.xp -= levelNeed(ST.level);
    ST.level++; up = true;
    ST.gems += 2;
    toast('Level up! Now level ' + ST.level + ' (+2 ' + CFG.currency.gem.name + ')', 'gold', 'star');
  }
  if (up){
    sfx('level'); hapOk(); confettiAt(130, 160, 60);
    rebuildFields();
    save(); renderNav();
    if (VIEW === 'mine') go('mine', true);
  }
}
let ACH_T = 0;
function tick(){
  try{
    const now = Date.now();
    const md = MAP(); if (!md) return;
    const bm = boostMult(), pb = gearVal('bonus');
    const purchaseBoost = getPurchaseBoostMult();
    let gained = 0;
    ST.fields.forEach((f, i) => {
      if (!f.unlocked || !f.miner) return;
      const inst = ST.miners[f.miner]; if (!inst) return;
      const def = CFG.miners.find(x => x.id === inst.id); if (!def) return;
      if (!f.vein){
        if (!f.respawnAt || now >= f.respawnAt) spawnVein(f);
        else return;
      }
      const p = minerPower(inst, def) * md.mult * (1 + pb) * bm * (1 + purchaseBoost);
      ST.ore += p; gained += p;
      f.vein.hp -= p;
      if (f.vein.hp <= 0) breakVein(f, i);
    });
    if (gained > 0){
      ST.stats.mined += gained;
      ST.xp += gained * (CFG.economy.xpPerOre || 0.05);
      checkLevel();
    }
    if (VIEW === 'mine') mineTickDom();
    ACH_T++;
    if (ACH_T % 5 === 0) checkAch();
    if (ACH_T % 5 === 0){ checkExpiredBoosts(); }
  }catch(e){ /* keep the loop alive */ }
}
function mineTickDom(){
  if (!MINE_ELS) return;
  ST.fields.forEach((f, i) => {
    const bar = MINE_ELS.bars[String(i)];
    if (bar && f.vein) bar.style.width = clamp(f.vein.hp / f.vein.hpMax * 100, 0, 100) + '%';
    const resp = document.querySelector('[data-fresp="' + i + '"] span');
    if (resp && !f.vein && f.respawnAt) resp.textContent = durTxt(f.respawnAt - Date.now());
  });
  const bc = $('#boostCd');
  if (bc){
    const bActive = (ST.boostUntil||0) > Date.now();
    if (bActive) bc.textContent = 'x' + (ST.boostMult||1) + ' - ' + durTxt(ST.boostUntil - Date.now());
  }
}
function checkAch(){
  const conds = {
    a1: ST.stats.veins >= 1, a2: Object.keys(ST.miners).length >= 3, a3: ST.stats.mined >= 1e4,
    a4: ST.mapId !== CFG.maps[0].id, a5: ST.gearOwned.length >= 3, a6: ST.stats.tasks >= 3,
    a7: ST.stats.mined >= 1e5, a8: ST.stats.veins >= 100, a9: ST.stats.buys >= 1,
    a10: Object.keys(ST.miners).length >= 6, a11: (ST.daily.streak||0) >= 7, a12: ST.stats.mined >= 1e6
  };
  const names = { a1:'First vein', a2:'Crew of 3', a3:'10K mined', a4:'Deep diver', a5:'Toolmaster', a6:'Taskrunner', a7:'100K mined', a8:'Vein crusher', a9:'First buy', a10:'Full crew', a11:'Streak 7', a12:'Millionaire' };
  let got = 0;
  for (const k in conds){
    if (conds[k] && !ST.ach[k]){ ST.ach[k] = Date.now(); got++; }
  }
  if (got){ save(); if (VIEW === 'mine') {} toast('Achievement unlocked', 'gold', 'trophy'); sfx('ok'); }
}

/* ================================ 17. RAF (smooth numbers + countdowns) ================================ */
const DISP = { ore: 0, frame: 0 };
function raf(){
  DISP.frame++;
  const slow = DISP.frame % 12 === 0;
  DISP.ore += (ST.ore - DISP.ore) * .25;
  if (Math.abs(ST.ore - DISP.ore) < .6) DISP.ore = ST.ore;
  const bal = fmt(DISP.ore);
  const hb = $('#heroBal'); if (hb && hb.textContent !== bal) hb.textContent = bal;
  if (slow){
    updChips();
    $$('[data-cd]').forEach(el => {
      const left = (+el.dataset.cd) - Date.now();
      if (left > 0) el.textContent = durTxt(left);
      else if (!el.dataset.done){ el.dataset.done = '1'; if (VIEW === 'mine' || VIEW === 'tasks') go(VIEW, true); }
    });
  }
  requestAnimationFrame(raf);
}

function tcManifestUrl(){
  let u = (CFG.payments && CFG.payments.tonconnect && CFG.payments.tonconnect.manifestUrl) || '';
  if (!u || String(u).indexOf('your-domain.com') !== -1) u = location.origin + '/tonconnect-manifest.json';
  return u;
}
/* The CDN UMD build of @tonconnect/ui exposes the global TON_CONNECT_UI.
   Some builds/older versions expose TonConnectUI - support both. */
function tcSDK(){ return window.TON_CONNECT_UI || window.TonConnectUI || null; }
function loadTonScript(){
  return new Promise((res, rej) => {
    if (tcSDK()) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@tonconnect/ui@2/dist/tonconnect-ui.min.js';
    s.onload = () => {
      let n = 0;
      const t = setInterval(() => {
        if (tcSDK()){ clearInterval(t); res(); }
        else if (++n > 40){ clearInterval(t); rej(new Error('TON Connect SDK failed to initialize')); }
      }, 50);
    };
    s.onerror = () => rej(new Error('TON Connect SDK failed to load - check internet connection'));
    document.head.appendChild(s);
  });
}
async function ensureTC(){
  await loadTonScript();
  const SDK = tcSDK();
  if (!SDK || !SDK.TonConnectUI) throw new Error('TON Connect SDK unavailable');
  if (!TCUI){
    try{
      TCUI = new SDK.TonConnectUI({ manifestUrl: tcManifestUrl() });
      TCUI.onStatusChange(w => {
        WALLET = w; TB_TONBAL = null; TB_BAL_TS = 0;
        updWalletDot();
        if (w && updWalletUI) updWalletUI();
        if (w && w.account && CFG.payments.tonconnect.showBalance !== false){
          fetchTonBalance(w.account.address).then(b => { if (b != null && updWalletUI) updWalletUI(); });
        }
      });
    }catch(e){
      TCUI = null;
      throw new Error('TON Connect init failed: ' + (e && e.message ? e.message : 'check manifest URL'));
    }
  }
  return TCUI;
}
async function fetchTonBalance(addr){
  if (!addr) return null;
  if (TB_TONBAL != null && Date.now() - TB_BAL_TS < 60000) return TB_TONBAL;
  try{
    const r = await fetch('https://tonapi.io/v2/accounts/' + addr, { headers: { Accept: 'application/json' } });
    if (!r.ok) return null;
    const j = await r.json();
    TB_TONBAL = Math.max(0, Number(j.balance || 0) / 1e9);
    TB_BAL_TS = Date.now();
    return TB_TONBAL;
  }catch(e){ return null; }
}
async function sendTon(amountTon, comment){
  const c = await ensureTC();
  if (!c.connected){ await c.connectWallet(); }
  if (!c.connected) throw new Error('Wallet not connected');
  const nano = BigInt(Math.round((Number(amountTon)||0) * 1e9)).toString();
  const msg = { address: CFG.payments.direct.address, amount: nano };
  // Include miner ID + user ID as transaction comment/memo
  if (comment){
    msg.payload = await encodeTonComment(comment);
  }
  const tx = { validUntil: Math.floor(Date.now()/1000) + 600, messages: [msg] };
  return await c.sendTransaction(tx);
}
/* Encode text comment as TON cell payload (base64 BOC) for transaction memo */
async function encodeTonComment(text){
  try{
    const { beginCell } = await import('https://cdn.jsdelivr.net/npm/@ton/core@0.57.0/+esm');
    const body = beginCell().storeUint(0, 32).storeStringTail(String(text).slice(0, 120)).endCell();
    return body.toBoc().toString('base64');
  }catch(e){
    // If @ton/core can't load, return null (transaction goes without comment)
    return null;
  }
}
function recordPay(pm, method, amountTon, extra){
  extra = extra || {};
  let itemName = pm.label || 'Purchase';
  if (pm.kind === 'miner'){ const d = CFG.miners.find(x => x.id === pm.id); itemName = d ? d.name : itemName; }
  else if (pm.kind === 'gear'){ const d = CFG.gear.find(x => x.id === pm.id); itemName = d ? d.name : itemName; }
  else if (pm.kind === 'boost'){ const d = (CFG.mining.boosts||[]).find(x => x.id === pm.id); itemName = d ? d.name : itemName; }
  else if (pm.kind === 'gems'){ const d = CFG.gemPacks.find(x => x.id === pm.id); itemName = d ? (d.label||'Gem pack') : itemName; }
  else if (pm.kind === 'upgrade'){ const d = CFG.miners.find(x => x.id === pm.id); itemName = 'Upgrade ' + (d ? d.name : 'Miner'); }
  const rec = { id: uid(), ts: Date.now(), userId: USER?USER.id:0, userName: USER?USER.name:'Guest',
    kind: pm.kind, item: itemName, method, amountTon: amountTon||0, currency: 'TON',
    status: extra.status || 'pending', txHash: extra.txHash || '', note: extra.note || '' };
  ST.pay.unshift(rec); ST.pay = ST.pay.slice(0, 50);
  const arr = LS.get('cp_payments', []); arr.unshift(rec); LS.set('cp_payments', arr.slice(0, 300));
  logEvent('purchase', rec);
  return rec;
}
function grantItem(kind, id){
  if (kind === 'miner'){
    const d = CFG.miners.find(x => x.id === id);
    if (d){ addMiner(d); toast(d.name + ' joined your crew', 'ok', 'check'); }
  } else if (kind === 'gear'){
    const d = CFG.gear.find(x => x.id === id);
    if (d && !ST.gearOwned.includes(id)){ ST.gearOwned.push(id); equipBest(d.slot); toast(d.name + ' delivered and equipped', 'ok', 'check'); }
  } else if (kind === 'gems'){
    const p = CFG.gemPacks.find(x => x.id === id);
    if (p){ const g = p.gems + Math.round(p.gems * (p.bonusPercent||0)/100); ST.gems += g; toast('+' + fmt(g) + ' ' + CFG.currency.gem.name + ' delivered', 'gold', 'gem'); }
  } else if (kind === 'boost'){
    const b = (CFG.mining.boosts||[]).find(x => x.id === id);
    if (b){ ST.boostUntil = Date.now() + b.minutes*60000; ST.boostMult = b.mult; toast(b.name + ' active for ' + b.minutes + ' min', 'ok', 'zap'); }
  } else if (kind === 'upgrade'){
    // Upgrade miner level after TON payment
    const minerUid = PM && PM.minerUid;
    if (minerUid && ST.miners[minerUid]){
      const inst = ST.miners[minerUid];
      inst.level = (inst.level || 1) + 1;
      const def = CFG.miners.find(x => x.id === inst.id);
      toast((def ? def.name : 'Miner') + ' upgraded to level ' + inst.level, 'ok', 'zap');
    }
  }
  // EARNINGS: Add purchase boost for TON purchases
  if (PM && PM.amountTon && PM.amountTon > 0){
    addPurchaseBoost(PM.amountTon);
    const pct = earningsCfg().purchaseBoostPercent || 0;
    const days = earningsCfg().purchaseBoostDays || 30;
    setTimeout(() => {
      toast('+' + pct + '% mining boost active for ' + days + ' days! TON refunded after expiry.', 'gold', 'zap');
    }, 800);
  }
  save(); updChips(true);
}

/* ================================ 19. CONTROL CHANNEL (panel bridge) ================================ */

if (BC) BC.onmessage = () => handleCpPush('config');
window.addEventListener('storage', e => {

});
window.addEventListener('cp-push', () => handleCpPush('*'));
function handleCpPush(what){
  try{
    if (what === 'config' || what === '*'){
      const prevFields = CFG ? CFG.mining.fields : null;
      loadConfig();
      applyPrefs(); renderTopbar(); renderNav();
      if (!CFG.maps.find(m => m.id === ST.mapId)) ST.mapId = CFG.maps[0].id;
      rebuildFields(); ensureState();
      closeAllTop(); go(VIEW, true);
      toast('Configuration updated by control panel', 'info', 'refresh');
    }
    if (what === 'inbox' || what === '*'){ consumeInbox(); }
    if (what === 'state'){
      const saved = LS.get('cp_state', null);
      if (saved){ ST = deepMerge(newState(), saved); ensureState(); closeAllTop(); go(VIEW, true); updChips(true); }
    }
  }catch(e){}
}
function consumeInbox(){
  const q = LS.get('cp_inbox', null);
  if (!q || !q.length) return;
  LS.set('cp_inbox', []);
  (Array.isArray(q) ? q : [q]).forEach(cmd => {
    try{
      if (cmd.cmd === 'grant'){
        if (cmd.ore) ST.ore += Number(cmd.ore)||0;
        if (cmd.gems) ST.gems += Number(cmd.gems)||0;
        if (cmd.xp) ST.xp += Number(cmd.xp)||0;
        save(); updChips(true); confettiAt(140, 140, 60);
        toast('Control panel granted: +' + fmt(cmd.ore||0) + ' ' + CFG.currency.ore.name + (cmd.gems ? ' +' + cmd.gems + ' ' + CFG.currency.gem.name : ''), 'gold', 'gift');
      } else if (cmd.cmd === 'notify'){
        toast(esc(cmd.title || 'Notice') + (cmd.msg ? ' - ' + esc(cmd.msg) : ''), 'info', 'info');
      } else if (cmd.cmd === 'reset'){
        LS.del('cp_state'); location.reload();
      }
    }catch(e){}
  });
}

      await window.FB.set(window.FB.ref(window.FB.db, 'bannedUsers/' + fbId), null);
      return true;
    }catch(e){ return false; }
  },
  isUserBanned: async (tgUserId) => {
    if (!window.FB || !FB_READY) return false;

    try{

  },

  getReferrals: async (tgUserId) => {

    const fbId = 'tg_' + tgUserId;
    try{

      if (snap.exists()){

        return Object.entries(val).map(([id, data]) => ({ id, ...data }));

      return [];

  editMiner: (id, updates) => {
    const m = CFG.miners.find(x => x.id === id);
    if (!m) return false;
    Object.assign(m, updates);

    if (!m) return false;

    m.enabled = false;

    if (CFG.miners.find(x => x.id === newId)) return false; // ID already exists
    m.id = newId;
    // Update owned instances

      if (ST.miners[k].id === oldId) ST.miners[k].id = newId;

    }));

/* ================================ 20. OFFLINE EARNINGS ================================ */
function offlineEarn(){
  const now = Date.now();
  const capH = (CFG.mining.offlineHoursCap||8) + gearVal('offlineHours');
  const dt = Math.min((now - (ST.lastSeen||now))/1000, capH*3600);
  if (dt < 90) return null;
  const rate = totalRate();
  if (rate <= 0) return null;
  const eff = CFG.mining.offlineEfficiency != null ? CFG.mining.offlineEfficiency : .6;
  const md = MAP();
  let ore = rate * dt * eff;
  const activeFields = ST.fields.filter(f => f.miner).length;
  const veins = Math.min(Math.floor(dt * rate / Math.max(1, CFG.mining.veinHPBase * md.hpMult)), activeFields);
  ore += veins * CFG.mining.veinValueBase * md.mult * .9 * eff;
  return { secs: dt, ore: Math.floor(ore), rate };
}

/* ================================ 21. BOOT ================================== */
function bindDelegation(){
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (!a) return;
    const fn = ACT[a.dataset.act];
    if (fn){ hap('light'); fn(a.dataset, a, e); }
  });
}
function boot(){
  loadConfig();
  loadState();
  ensureDay();
  applyPrefs();
  fxInit();
  bgParticles();
  initTG();
  bindDelegation();
  // 1. Early check: if user was previously blocked (multi-account), show banned page
  if (ST.friends.blockedReferrals && ST.friends.blockedReason){
    showMultiAccountBlock(ST.friends.blockedReason, '');
    return;
  }
  // 2. Check mandatory tasks - if not done, show gate and stop boot
  const MT = CFG.mandatoryTasks;
  if (MT && MT.enabled){
    if (!ST.mandatoryTasksDone){
      // Show mandatory gate - user hasn't joined channels yet
      showMandatoryGate();
      return; // Stop boot until user joins channels
    } else {
      // Tasks were done previously - start periodic checking
      // Verify still joined (async, don't block boot)
      setTimeout(() => {
        checkAllMandatoryTasks().then(done => {
          if (!done){
            // User left a channel - show gate
            showMandatoryGate();
          } else {
            startMandatoryCheckInterval();
          }
        });
      }, 2000);
    }
  }
  renderTopbar();
  renderNav();
  updChips(true);
  go('mine');
  setInterval(tick, clamp(CFG.mining.tickMs||1000, 200, 5000));
  requestAnimationFrame(raf);
  setInterval(() => { ST.lastSeen = Date.now(); save(); }, 10000);
  consumeInbox();
  // EARNINGS: check for expired boosts on boot
  setTimeout(() => { checkExpiredBoosts(); }, 2000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  window.addEventListener('pagehide', () => { try{ saveNow(); }catch(e){} });
  setTimeout(() => { $('#splash').classList.add('gone'); }, CFG.ui.splashMinMs || 1100);
  setTimeout(() => {
    const off = offlineEarn();
    if (off){ window.__OFFLINE__ = off; sheetOffline(off); }
  }, (CFG.ui.splashMinMs || 1100) + 450);
}
boot();
