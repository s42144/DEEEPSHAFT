
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a" id="metaTheme">
<title>DeepShaft - Idle Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DEEPSHAFT - Telegram Mini App (Idle Mining)
   Single-file build. Control panel contract documented in the
   main <script> block at the bottom of this file.
   =========================================================== */
:root{
  --bg:#0b0f1a; --bg2:#0d1322; --card:#131c2e; --card2:#182338; --line:#223047;
  --txt:#eaf0fb; --mut:#8b98ad;
  --accent:#f5b942; --accent2:#22d3ee;
  --good:#34d399; --bad:#f87171; --gem:#e879f9;
  --nav-h:68px; --tb-h:96px;
  --status-clear:54px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#05080f;color:var(--txt);overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
img{-webkit-user-drag:none}
button{font-family:inherit}
.hide{display:none!important}
.mut{color:var(--mut)} .sm{font-size:12px} .xs{font-size:10.5px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.center{align-items:center}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:4px}
.end{align-items:flex-end}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mb10{margin-bottom:10px}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none}
.ic-ore{color:var(--accent)} .ic-gem{color:var(--gem)} .ic-ton{color:var(--accent2)}
.note{font-size:11.5px;color:var(--mut);line-height:1.55}
.hr{height:1px;background:var(--line);margin:12px 0;border:none}

/* ---------- App shell ---------- */
#appwrap{
  position:relative;width:min(100vw,520px);margin:0 auto;
  height:100vh;height:100dvh;height:var(--vh,100dvh);
  background:var(--bg);overflow:hidden;
}
@media(min-width:560px){#appwrap{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#bgfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bgfx:before{content:'';position:absolute;inset:0;
  background:radial-gradient(700px 420px at 50% -8%, rgba(34,211,238,.07), transparent 70%),
             radial-gradient(560px 400px at 110% 112%, rgba(245,185,66,.07), transparent 70%)}
#bgfx .pt{position:absolute;border-radius:50%;animation:drift linear infinite}
#view{
  position:absolute;left:0;right:0;top:0;bottom:0;z-index:10;
  padding:calc(var(--safe-t) + var(--tb-h) + 10px) 13px calc(var(--nav-h) + var(--safe-b) + 16px);
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#view::-webkit-scrollbar{display:none}
.viewin{animation:fadein .28s ease}

/* ---------- Splash ---------- */
#splash{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(600px 420px at 50% 28%, #17223c, var(--bg));
  transition:opacity .5s ease,visibility .5s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
#splash .slogo{width:112px;height:112px;filter:drop-shadow(0 14px 34px rgba(245,185,66,.35));animation:floaty 3s ease-in-out infinite}
#splash .sname{font-size:30px;font-weight:800;letter-spacing:.2em;padding-left:.2em}
#splash .stag{color:var(--mut);font-size:11.5px;letter-spacing:.34em;text-transform:uppercase;padding-left:.34em}
#splash .sbar{width:190px;height:4px;background:var(--card);border-radius:99px;overflow:hidden;margin-top:10px}
#splash .sbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;animation:loadslide 1.1s ease-in-out infinite}

/* ---------- Topbar (balance header - no logo/text) ---------- */
#topbar{position:absolute;top:0;left:0;right:0;z-index:65;
  padding:calc(var(--safe-t) + var(--status-clear)) 14px 12px;
  background:linear-gradient(180deg,rgba(13,19,34,.97),rgba(11,15,26,.88));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(34,48,71,.6);
  display:flex;justify-content:center;align-items:flex-end;
  min-height:calc(var(--safe-t) + var(--tb-h))}
.tb-row1{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:100%;padding-bottom:4px}
.tb-bal{flex:0 1 auto;min-width:0;max-width:90%;
  display:flex;align-items:center;gap:7px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:99px;
  padding:7px 14px;overflow:hidden;transition:transform .12s}
.tb-bal:active{transform:scale(.96)}
.tb-bic{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--accent);
  background:linear-gradient(140deg,rgba(245,185,66,.18),rgba(245,185,66,.04));
  border:1px solid rgba(245,185,66,.3)}
.tb-bic .ic{width:13px;height:13px}
.tb-bv{font-size:14px;font-weight:800;line-height:1;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--txt)}
.tb-bc{font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--mut);flex:none;text-transform:uppercase}
.tb-wallet{display:none!important}
.tb-dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--good);
  border:2px solid #0b1322;opacity:0;transition:opacity .25s}
.tb-dot.on{opacity:1}
.tb-row2{display:none!important}
.tb-pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;font-weight:800;font-size:12px;line-height:1;white-space:nowrap;
  max-width:100%;min-width:0;overflow:hidden}
.tb-pill .ic{width:13px;height:13px;flex:none}
.tb-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-pill.gem{color:var(--gem);border-color:rgba(232,121,249,.35)}
.tb-pill.lvl{color:var(--accent2);border-color:rgba(34,211,238,.35)}
.tb-pill.rate{color:var(--good);border-color:rgba(52,211,153,.32);margin-left:auto}
.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}

/* ---------- Bottom navigation (redesigned with animated icons) ---------- */
#nav{position:absolute;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;align-items:stretch;flex-wrap:nowrap;
  padding:6px 4px calc(var(--safe-b) + 10px);
  background:rgba(9,13,22,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(34,48,71,.7)}
.nav-b{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px 11px;background:none;border:none;
  color:var(--mut);font-size:9px;font-weight:800;letter-spacing:.03em;cursor:pointer;position:relative;transition:color .2s}
.nav-b .lb{text-align:center;white-space:nowrap;font-size:9px;letter-spacing:.03em;line-height:1}
.nav-b .nav-ico{width:26px;height:26px;overflow:visible;transition:transform .28s cubic-bezier(.34,1.56,.64,1);flex:none}
.nav-b.on{color:var(--accent)}
.nav-b.on .nav-ico{transform:translateY(-3px) scale(1.15)}
.nav-b:before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);width:34px;height:3px;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:transform .25s}
.nav-b.on:before{transform:translateX(-50%) scaleX(1)}
.nav-badge{position:absolute;top:2px;right:calc(50% - 24px);min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;
  font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;
  box-shadow:0 2px 10px rgba(248,113,113,.55);z-index:2}

/* ---- Animated nav icons ---- */
.nav-ico svg{overflow:visible}
/* DIG - swinging pickaxe + sparkles */
.nav-dig .nv-swing{animation:nvSwing 2.2s ease-in-out infinite;transform-origin:14px 22px;transform-box:fill-box}
.nav-dig .nv-spark1{animation:nvBlink 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.nav-dig .nv-spark2{animation:nvBlink 1.6s ease-in-out infinite .5s;transform-origin:center;transform-box:fill-box}
/* JOBS - checkmark draw + clip pulse */
.nav-jobs .nv-check{stroke-dasharray:18;stroke-dashoffset:18;animation:nvDraw 2.8s ease-in-out infinite}
.nav-jobs .nv-clip{animation:nvPulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
/* SHOP - bag bounce + coin spin */
.nav-shop .nv-bounce{animation:nvBounce 1.8s ease-in-out infinite;transform-origin:14px 24px;transform-box:fill-box}
.nav-shop .nv-coin{animation:nvSpin 2.5s linear infinite;transform-origin:center;transform-box:fill-box}
/* CREW - people pulse */
.nav-crew .nv-p1{animation:nvPulse 2s ease-in-out infinite;transform-origin:10px 11px;transform-box:fill-box}
.nav-crew .nv-p2{animation:nvPulse 2s ease-in-out infinite .35s;transform-origin:20px 9px;transform-box:fill-box}
/* MENU - bars wave */
.nav-menu .nv-bar1{animation:nvWave 1.5s ease-in-out infinite}
.nav-menu .nv-bar2{animation:nvWave 1.5s ease-in-out infinite .15s}
.nav-menu .nv-bar3{animation:nvWave 1.5s ease-in-out infinite .3s}
/* Active button - boost animations */
.nav-b.on .nav-dig .nv-swing{animation-duration:1.2s}
.nav-b.on .nav-shop .nv-bounce{animation-duration:1s}
.nav-b.on .nav-crew .nv-p1{animation-duration:1.2s}
.nav-b.on .nav-crew .nv-p2{animation-duration:1.2s}

@keyframes nvSwing{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}50%{transform:rotate(8deg)}80%{transform:rotate(-5deg)}}
@keyframes nvBlink{0%,100%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.3)}60%{opacity:1;transform:scale(1)}}
@keyframes nvDraw{0%{stroke-dashoffset:18}35%{stroke-dashoffset:0}75%{stroke-dashoffset:0}90%,100%{stroke-dashoffset:18}}
@keyframes nvBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes nvSpin{to{transform:rotate(360deg)}}
@keyframes nvPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes nvWave{0%,100%{transform:translateX(-1px) scaleX(1)}50%{transform:translateX(1.5px) scaleX(.92)}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;
  font-weight:800;font-size:13.5px;color:#241703;border-radius:14px;padding:12px 18px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--accent),#ffd98a);
  box-shadow:0 6px 20px rgba(245,185,66,.28), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .12s ease, filter .2s;
  white-space:nowrap;min-width:0;max-width:100%;text-overflow:ellipsis}
.btn span,.btn b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn:active{transform:scale(.955)}
.btn:disabled{filter:grayscale(.8) brightness(.55);pointer-events:none}
.btn::after{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);animation:sheen 3.4s ease-in-out infinite}
.btn.pulse{animation:glowp 2.2s ease-in-out infinite}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost::after{display:none}
.btn.tonb{background:linear-gradient(135deg,#22d3ee,#0ea5e9);color:#032530;box-shadow:0 6px 20px rgba(34,211,238,.3), inset 0 1px 0 rgba(255,255,255,.4)}
.btn.danger{background:linear-gradient(135deg,#f87171,#dc2626);color:#2b0606;box-shadow:0 6px 18px rgba(220,38,38,.3)}
.btn.danger::after{display:none}
.btn.sm{padding:8px 11px;font-size:11.5px;border-radius:11px;gap:5px;min-width:0;max-width:100%;overflow:hidden}
.btn.sm .ic{width:14px;height:14px}
.btn.block{width:100%}
.btn.xs2{padding:6px 10px;font-size:11px;border-radius:10px}
.qacts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.qacts .btn{font-size:11px;padding:8px 6px;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Cards / common ---------- */
.card{background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:14px}
.stitle{display:flex;align-items:center;gap:8px;margin:18px 4px 10px;font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.stitle:before{content:'';width:4px;height:13px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent2))}
.stitle .st-x{margin-left:auto;letter-spacing:0;text-transform:none;font-size:11px;color:var(--accent2);font-weight:800;cursor:pointer;display:flex;align-items:center;gap:3px}
.pbar{height:9px;background:#0a0f1c;border-radius:99px;overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;position:relative;transition:width .4s}
.pbar>i:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.45) 50%,transparent 75%);background-size:200% 100%;animation:barshine 2.4s linear infinite}
.tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid currentColor}
.rchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--accent);
  background:rgba(245,185,66,.09);border:1px solid rgba(245,185,66,.28);padding:2px 8px;border-radius:99px}
.rchip .ic{width:12px;height:12px}
.rchip.gemc{color:var(--gem);background:rgba(232,121,249,.09);border-color:rgba(232,121,249,.3)}
.rchip.tonc{color:var(--accent2);background:rgba(34,211,238,.09);border-color:rgba(34,211,238,.3)}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:#0a101d;border:1px solid var(--line);
  border-radius:12px;padding:10px;word-break:break-all;color:var(--accent2);line-height:1.5}
.inp{width:100%;background:#0a101d;border:1px solid var(--line);border-radius:13px;color:var(--txt);
  padding:12px;font-family:inherit;font-size:14px;font-weight:600;outline:none;transition:border .2s}
.inp:focus{border-color:var(--accent)}
.lb{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;display:block;margin:13px 0 6px}
.divd{border-bottom:1px dashed rgba(255,255,255,.08)}
.sw{width:32px;height:32px;border-radius:11px;border:2px solid transparent;cursor:pointer;flex:none}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.2)}

/* ---------- Mine hero ---------- */
.hero{position:relative;overflow:hidden;padding:16px;border-radius:20px;
  background:linear-gradient(150deg,#1b2745,#111a30 55%,#16223c);border:1px solid var(--line)}
.hero:after{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.06),transparent);animation:sheen 5s ease-in-out infinite}
.hero .hlab{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}
.hero .hbal{font-size:31px;font-weight:800;display:flex;align-items:center;gap:9px;margin-top:2px;line-height:1.1;min-width:0;max-width:100%;flex-wrap:nowrap}
.hero .hbal .num{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.hero .hbal .ic{width:24px;height:24px}
.hero .hcur{font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.08em;align-self:flex-end;padding-bottom:5px}
.hero .hsub{font-size:12px;color:var(--accent2);font-weight:800;margin-top:3px}
.hero .hxpp{margin-top:11px;display:flex;align-items:center;gap:8px}
.hero .hxpp .lvb{flex:none;font-size:10.5px;font-weight:800;color:var(--accent2);border:1px solid rgba(34,211,238,.4);
  padding:3px 8px;border-radius:99px;background:rgba(34,211,238,.08)}
.hero .hxpp .pbar{flex:1;height:7px}
.hero .hxpp .xt{font-size:10px;color:var(--mut);font-weight:800;flex:none}
.mstrip{display:flex;align-items:center;margin-top:12px}
.mstrip .mav{width:27px;height:27px;border-radius:50%;background:var(--card);border:2px solid var(--bg2);margin-left:-7px;overflow:hidden}
.mstrip .mav:first-child{margin-left:0}
.mstrip .mav svg{width:100%;height:100%}
.mstrip .more-b{margin-left:8px;font-size:10.5px;color:var(--mut);font-weight:800}
.bchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:5px 10px;border-radius:99px;
  background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35);color:var(--good)}
.bchip .ic{width:12px;height:12px}

/* ---------- Daily chest ---------- */
.dchest{display:flex;align-items:center;gap:13px}
.dchest .cico{width:56px;height:56px;flex:none;filter:drop-shadow(0 6px 16px rgba(245,185,66,.35));animation:floaty 2.6s ease-in-out infinite}
.dchest .ct{font-weight:800;font-size:14px}
.dchest .cd{font-size:11.5px;color:var(--mut);margin-top:2px}

/* ---------- Mine scene ---------- */
.scenecard{padding:10px}
.schead{display:flex;align-items:center;gap:8px;padding:4px 4px 9px}
.mapdot{width:12px;height:12px;border-radius:4px;flex:none}
.schead .mname{font-weight:800;font-size:14px}
.mchip{font-size:10px;font-weight:800;color:var(--accent2);border:1px solid rgba(34,211,238,.35);border-radius:99px;padding:2px 8px;background:rgba(34,211,238,.07)}
.scene{width:100%;display:block;border-radius:14px}
.sc-cart{animation:cartmove 9s ease-in-out infinite alternate}
.sc-crystal{animation:cpulse 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.sc-spark{animation:flick .5s steps(2,end) infinite;transform-box:fill-box}
.sc-dust{animation:dustfall 4.5s linear infinite;opacity:0;transform-box:fill-box}
.sc-lamp{animation:lampsway 5s ease-in-out infinite;transform-origin:top center;transform-box:fill-box}
.sc-orb{animation:orb 7s linear infinite;transform-origin:center;transform-box:fill-box}
.feed{display:flex;gap:7px;overflow:hidden;padding:8px 2px 2px;min-height:30px}
.lchip{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;
  background:var(--card2);border:1px solid var(--line);animation:slidein .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;flex:none}
.lchip .ld{width:7px;height:7px;border-radius:2.5px}

/* ---------- Fields grid ---------- */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.field{position:relative;aspect-ratio:1/1.14;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:9px 6px 8px;cursor:pointer;border-radius:16px;overflow:hidden;
  background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);transition:transform .14s}
.field:active{transform:scale(.95)}
.field .fav{width:44px;height:44px}
.field .fn{font-size:10px;font-weight:800;text-align:center;line-height:1.2;color:var(--txt)}
.field .fbarw{width:100%}
.field .fbarw .pbar{height:6px}
.field.emptyf{border-style:dashed;border-color:#2b3b5a}
.field.emptyf .plusw{width:42px;height:42px;border-radius:14px;background:rgba(34,211,238,.07);border:1px dashed rgba(34,211,238,.4);
  display:flex;align-items:center;justify-content:center;color:var(--accent2)}
.f-vein{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;width:100%}
.f-vein .ld{width:7px;height:7px;border-radius:2.5px;flex:none}
.f-vein .fvt{flex:1;text-align:left;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate-chip{position:absolute;top:5px;right:5px;font-size:8.5px;font-weight:800;color:var(--accent2);
  background:rgba(8,12,22,.72);padding:2px 6px;border-radius:99px;border:1px solid rgba(255,255,255,.06)}
.field.locked{cursor:default}
.field.locked .lockov{position:absolute;inset:0;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;
  background:rgba(7,10,18,.78);backdrop-filter:blur(2px);font-size:10px;font-weight:800;color:var(--mut)}
.field.locked .lockov .ic{width:16px;height:16px}
.float-ore{position:absolute;left:50%;top:36%;font-size:12.5px;font-weight:800;color:var(--accent);
  text-shadow:0 2px 10px rgba(0,0,0,.7);animation:floatup 1.4s ease-out forwards;pointer-events:none;z-index:5}
.fresp{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;color:var(--mut)}
.fresp .ic{width:11px;height:11px}

/* ---------- Tasks ---------- */
.tcard{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px}
.ticon{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:rgba(34,211,238,.08);border:1px solid var(--line);color:var(--accent2)}
.ticon .ic{width:21px;height:21px}
.tmain{flex:1;min-width:0}
.tt{font-weight:800;font-size:13.5px;line-height:1.2}
.td{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.trew{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}

/* ---------- Friends ---------- */
.fhero{position:relative;overflow:hidden;text-align:center;padding:22px 16px;border-radius:20px;
  background:linear-gradient(160deg,#1c2a4a,#111a30 70%);border:1px solid var(--line)}
.fhero .fico{width:64px;height:64px;margin:0 auto 10px;color:var(--accent);animation:floaty 3s ease-in-out infinite}
.fhero .ft{font-size:18px;font-weight:800}
.fhero .fd{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.5}
.refbox{display:flex;gap:8px;margin-top:12px}
.refbox>.btn{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 10px;font-size:11.5px}
.fstat{flex:1;text-align:center;padding:12px 6px}
.fstat b{font-size:18px;display:block}
.fstat span{font-size:9.5px;color:var(--mut);font-weight:800;letter-spacing:.08em;text-transform:uppercase}

/* ---------- Store ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);
  font-weight:800;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.tab .ic{width:14px;height:14px}
.tab.on{color:#241703;background:linear-gradient(135deg,var(--accent),#ffd98a);border-color:transparent}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.scard .sico{width:54px;height:54px;border-radius:16px;overflow:visible;
  background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.09), transparent 62%),var(--card2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.scard .sico svg{width:40px;height:40px}
.scard .bn{font-weight:800;font-size:12.5px;line-height:1.2}
.scard .own{position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:800;color:var(--mut);
  border:1px solid var(--line);border-radius:99px;padding:2px 7px;background:rgba(10,16,29,.7)}
.pchips{display:flex;flex-direction:column;gap:4px}
.pchip{font-size:11px;font-weight:800;display:flex;gap:5px;align-items:center;color:var(--txt)}
.pchip .ic{width:13px;height:13px}

/* ---------- More ---------- */
.pmini{display:flex;align-items:center;gap:12px;cursor:pointer}
.avatar{width:56px;height:56px;border-radius:50%;border:2px solid var(--accent);object-fit:cover;background:var(--card2);flex:none}
.pmini .pn{font-weight:800;font-size:15.5px}
.pmini .pu{font-size:11.5px;color:var(--mut);font-weight:700;margin-top:1px}
.lvbadge{margin-left:auto;flex:none;text-align:center;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.4);
  color:var(--accent2);border-radius:14px;padding:6px 10px}
.lvbadge b{font-size:16px;display:block;line-height:1}
.lvbadge span{font-size:8.5px;font-weight:800;letter-spacing:.1em}
.mrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;
  background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);margin-bottom:9px;cursor:pointer;transition:transform .12s}
.mrow:active{transform:scale(.977)}
.mico{width:40px;height:40px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:rgba(245,185,66,.09);color:var(--accent);border:1px solid var(--line)}
.mico.cy{background:rgba(34,211,238,.09);color:var(--accent2)}
.mico.gr{background:rgba(52,211,153,.09);color:var(--good)}
.mico.rd{background:rgba(248,113,113,.09);color:var(--bad)}
.mico .ic{width:19px;height:19px}
.mrow .mt2{flex:1;min-width:0}
.mrow .mt2 b{font-size:13.5px;font-weight:800;display:block}
.mrow .mt2 span{font-size:11px;color:var(--mut);font-weight:600;margin-top:1px;display:block}
.mrow .chev{color:var(--mut);flex:none}

/* ---------- Pages (full overlay) ---------- */
#pageRoot .page{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:calc(var(--safe-t) + var(--tb-h) + 10px) 14px calc(var(--safe-b) + 26px);
  transform:translateX(26px);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.3,1,.4,1),opacity .28s}
#pageRoot .page::-webkit-scrollbar{display:none}
#pageRoot .page.open{transform:none;opacity:1;pointer-events:auto}
.page-h{display:flex;align-items:center;gap:11px;padding:calc(var(--safe-t) + 12px) 14px 12px;
  border-bottom:1px solid var(--line);background:rgba(11,15,26,.85);backdrop-filter:blur(14px)}
.page-h .backb{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--txt);cursor:pointer;flex:none}
.page-h .backb:active{transform:scale(.92)}
.page-h .pt{font-weight:800;font-size:16px}
.page-c{flex:1;overflow-y:auto;padding:14px 14px calc(var(--safe-b) + 26px);scrollbar-width:none}
.page-c::-webkit-scrollbar{display:none}

/* ---------- Sheets ---------- */
.sh-wrap{position:absolute;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sh-bd{position:absolute;inset:0;background:rgba(4,7,14,.62);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-height:88%;overflow-y:auto;scrollbar-width:none;
  background:linear-gradient(180deg,#182338,var(--card));border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;
  padding:10px 16px calc(var(--safe-b) + 20px);transform:translateY(100%);transition:transform .3s cubic-bezier(.3,1,.4,1)}
.sheet::-webkit-scrollbar{display:none}
.sh-wrap.open .sh-bd{opacity:1}
.sh-wrap.open .sheet{transform:none}
.sheet .grab{width:44px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 14px}
.sheet .sh-t{font-weight:800;font-size:16px;margin-bottom:4px}

/* ---------- Modals / confirm ---------- */
.md-wrap{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.md-wrap .sh-bd{z-index:0}
.md{position:relative;width:100%;max-width:350px;background:linear-gradient(170deg,#172135,var(--card));
  border:1px solid var(--line);border-radius:22px;padding:20px;transform:scale(.9);opacity:0;
  transition:.25s cubic-bezier(.34,1.56,.64,1)}
.md-wrap.open .md{transform:none;opacity:1}

/* ---------- Payment methods ---------- */
.pm{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);margin-bottom:8px;cursor:pointer;transition:all .15s}
.pm.on{border-color:var(--accent);background:linear-gradient(160deg,rgba(245,185,66,.08),var(--card))}
.pm .pico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--card2);color:var(--accent2);flex:none}
.pm .pt2{font-weight:800;font-size:13px}
.pm .pd{font-size:10.5px;color:var(--mut);margin-top:1px}
.pm .radio{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);margin-left:auto;flex:none;transition:all .15s}
.pm.on .radio{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 42%,transparent 48%)}

/* ---------- Wallet ---------- */
.wrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 2px;font-size:13px}
.wrow b{font-weight:800}
.wtag{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid;letter-spacing:.06em;text-transform:uppercase}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st-tile{padding:11px 6px;text-align:center}
.st-tile b{font-size:14.5px;display:block}
.st-tile span{font-size:8.5px;color:var(--mut);font-weight:800;letter-spacing:.07em;text-transform:uppercase}

/* ---------- Swap ---------- */
.swap-dir{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#0a101d;border:1px solid var(--line);border-radius:14px;padding:5px}
.sdir{border:none;background:none;color:var(--mut);font-weight:800;font-size:11.5px;padding:9px 4px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;min-width:0;transition:all .18s}
.sdir .ic{width:13px;height:13px;flex:none}
.sdir span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdir.on{background:linear-gradient(135deg,var(--accent),#ffd98a);color:#241703}

/* ---------- Settings ---------- */
.tg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px dashed rgba(255,255,255,.07)}
.tg-row .tt2{font-weight:800;font-size:13.5px}
.tg-row .td2{font-size:11px;color:var(--mut);margin-top:2px}
.switch{width:46px;height:26px;border-radius:99px;background:#222e4a;position:relative;cursor:pointer;transition:background .2s;flex:none;border:1px solid var(--line)}
.switch:after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#8b98ad;transition:.2s}
.switch.on{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent}
.switch.on:after{left:22px;background:#fff}

/* ---------- Profile / achievements ---------- */
.pcard{position:relative;overflow:hidden;padding:16px;border-radius:20px;background:linear-gradient(140deg,#1b2745,#121a2e);border:1px solid var(--line)}
.lvring{width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1%),#223047 0);
  display:flex;align-items:center;justify-content:center;flex:none}
.lvring>div{width:58px;height:58px;border-radius:50%;background:#141d31;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvring b{font-size:17px;line-height:1}
.lvring span{font-size:7.5px;font-weight:800;letter-spacing:.14em;color:var(--mut)}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ach{padding:10px 4px;text-align:center;position:relative}
.ach .ic{width:20px;height:20px;margin:0 auto}
.ach b{font-size:9px;display:block;margin-top:5px;font-weight:800;line-height:1.2}
.ach.lock{opacity:.38}
.ach.un{border-color:rgba(245,185,66,.45);box-shadow:0 0 14px rgba(245,185,66,.1)}

/* ---------- Toasts / FX ---------- */
#toasts{position:absolute;top:calc(var(--safe-t) + var(--tb-h) + 6px);left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:rgba(18,26,44,.96);border:1px solid var(--line);
  padding:10px 15px;border-radius:14px;font-size:12.5px;font-weight:800;box-shadow:0 12px 34px rgba(0,0,0,.5);
  animation:toastin .32s cubic-bezier(.34,1.56,.64,1);max-width:86%;pointer-events:auto}
.toast.out{animation:toastout .3s forwards}
.toast .ic{width:15px;height:15px;flex:none}
.toast.ok .ic{color:var(--good)} .toast.err .ic{color:var(--bad)} .toast.info .ic{color:var(--accent2)} .toast.gold .ic{color:var(--accent)}
#fx{position:absolute;inset:0;z-index:95;pointer-events:none}

/* ---------- Miners (animated avatar) ---------- */
.m-bob{animation:bob 2.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pick-sw{animation:swing 1.15s ease-in-out infinite;transform-box:fill-box;transform-origin:12% 88%}
.chest-g{animation:chestg 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

/* ---------- Keyframes ---------- */
@keyframes sheen{0%,55%{left:-70%}100%{left:135%}}
@keyframes barshine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes loadslide{0%{transform:translateX(-130%)}100%{transform:translateX(330%)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes fadein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translateY(-14px) scale(.94)}}
@keyframes toastout{to{opacity:0;transform:translateY(-10px) scale(.94)}}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-36px) scale(1.06)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes glowp{0%,100%{box-shadow:0 6px 18px rgba(245,185,66,.25)}50%{box-shadow:0 6px 30px rgba(245,185,66,.55)}}
@keyframes drift{0%{transform:translateY(108vh) scale(.6);opacity:0}12%{opacity:.75}85%{opacity:.35}100%{transform:translateY(-6vh) scale(1.05);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes swing{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-30deg)}}
@keyframes chestg{0%,100%{transform:scale(1);filter:drop-shadow(0 0 4px rgba(245,185,66,.4))}50%{transform:scale(1.05);filter:drop-shadow(0 0 14px rgba(245,185,66,.8))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes cartmove{from{transform:translateX(14px)}to{transform:translateX(196px)}}
@keyframes cpulse{0%,100%{opacity:.6;transform:scale(.93)}50%{opacity:1;transform:scale(1.07)}}
@keyframes flick{0%{opacity:0}50%{opacity:1}100%{opacity:.15}}
@keyframes dustfall{0%{transform:translateY(-8px);opacity:0}18%{opacity:.75}100%{transform:translateY(48px);opacity:0}}
@keyframes lampsway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes orb{to{transform:rotate(360deg)}}

@media(max-width:368px){
  .tb-bv{font-size:12px}.tb-bic{width:16px;height:16px}.tb-bic .ic{width:11px;height:11px}
  .tb-bal{padding:5px 11px;gap:5px}.tb-bc{font-size:8px;letter-spacing:.08em}
  .nav-b{font-size:8.5px}.nav-b .lb{font-size:8.5px}.nav-b .nav-ico{width:23px;height:23px}.fgrid{gap:7px}
  .hero .hbal{font-size:24px}.hero .hbal .ic{width:20px;height:20px}
  .btn.sm{font-size:10.5px;padding:7px 8px}
  .refbox>.btn{font-size:10.5px;padding:7px 8px}
  .qacts .btn{font-size:10px;padding:7px 4px}
}
body.reduce *,body.reduce *:before,body.reduce *:after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
'use strict';
/* ================================================================================================
   CONTROL PANEL CONTRACT (for control.html - same origin)
   ------------------------------------------------------------------------------------------------
   Everything in this Mini App is controlled through localStorage keys below. Both files must be
   hosted on the SAME origin (same domain), then control.html can fully drive this app.

   STORAGE KEYS
     cp_config JSON object, deep-merged over DEFAULT_CONFIG. Any field you set overrides the
                     default: app name/tagline/logo, ui colors/toggles/nav order, currencies, mining
                     numbers (fields, rates, boosts), maps, miners (characters), gear, tasks, gems
                     packs, payment settings (TON Connect manifest, direct address, manual text),
                     withdrawal rules and page texts. Arrays are replaced wholesale, so you can
                     replace the whole tasks/miners/maps lists from the panel.
     cp_state Game save JSON (ore, gems, xp, level, miners, gear, tasks progress...).
                     Edit it to grant balances or levels. The app re-reads it when the key changes.
     cp_inbox ARRAY of commands consumed by the app on boot and whenever the key changes:
                       [{ "cmd":"grant", "ore":1000, "gems":5, "xp":200 },
                        { "cmd":"notify", "title":"Update", "msg":"New map available" },
                        { "cmd":"reset" }]
     cp_payments ARRAY written by the app on every purchase/checkout:
                       { id, ts, userId, userName, kind, item, method, amountTon, status, txHash }
                     status: "pending" | "paid". Flip to "paid" after manual verification.
     cp_withdrawals ARRAY written by the app on ORE withdrawal requests:
                       { id, ts, userId, userName, address, amountOre, fee, amountTon, status }
     cp_events ARRAY activity log for dashboards (purchases, withdrawals, tasks, joins, swaps).

   KEY cp_config SECTIONS (all optional - deep merged over defaults):
     app name, tagline, logoUrl, botUsername, supportUrl
     ui accent, accent2, fullscreen, backButtonExit, splashMinMs,
                    navOrder ['mine','tasks','store','friends','more'],
                    navLabels { mine:'Mine', tasks:'Tasks', ... } <- bottom nav texts
     currency ore { name, start }, gem { name, start, enabled }
     economy orePerTon, xpPerOre, withdraw {...}, deposit {...}
     swap { enabled, feePercent, oreToGem:{enabled,rate}, gemToOre:{enabled,rate},
                    minOre, minGem } <- wallet instant swap (ORE <-> GEM)

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){
  n = Number(n) || 0;
  if (Math.abs(n) < 1000) return (Math.round(n*10)/10).toString();
  const u = ['K','M','B','T','Qa']; let i = -1;
  while (Math.abs(n) >= 1000 && i < u.length-1){ n /= 1000; i++; }
  return (Math.abs(n) >= 100 ? Math.round(n) : Math.round(n*100)/100) + u[i];
}
function fmtTon(n){ return (Math.round((Number(n)||0)*1000)/1000).toString(); }
function shortAddr(a){ a = a||''; return a.length > 14 ? a.slice(0,6)+'...'+a.slice(-4) : a; }
function rnd(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a, b+1)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function durTxt(ms){
  ms = Math.max(0, ms);
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  if (h > 0) return h+'h '+m+'m';
  if (m > 0) return m+'m '+(s%60)+'s';
  return s+'s';
}
function deepMerge(base, over){
  if (over === undefined || over === null) return base;
  if (Array.isArray(over)) return JSON.parse(JSON.stringify(over));
  if (typeof over === 'object' && typeof base === 'object' && base !== null && !Array.isArray(base)){
    const out = { ...base };
    for (const k in over) out[k] = deepMerge(base[k], over[k]);
    return out;
  }
  return over;
}
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  raw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
};

}
function fallbackCopy(t, done){

  }catch(e){ toast('Copy failed', 'err'); }
}

function fieldReq(i){ return (CFG.mining.fieldReqLevel||1) + i*(CFG.mining.fieldLevelStep||2); }
function newField(i){ const r = fieldReq(i); return { req:r, unlocked:false, miner:null, vein:null, respawnAt:0 }; }
function rebuildFields(){
  const n = clamp(CFG.mining.fields|0, 1, 12);
  const arr = (ST.fields || []).slice(0, n);
  while (arr.length < n) arr.push(newField(arr.length));
  arr.forEach((f, i) => { f.req = fieldReq(i); f.unlocked = ST.level >= f.req; });
  ST.fields = arr;
  // Clean orphan assignments
  for (const k in ST.miners){
    const m = ST.miners[k];
    if (m.field !== null && m.field !== undefined && (!ST.fields[m.field] || ST.fields[m.field].miner !== k)) m.field = null;
  }
  ST.fields.forEach(f => { if (f.miner && !ST.miners[f.miner]) f.miner = null; });
}
function ensureState(){
  ST.prefs = ST.prefs || {};
  ST.stats = Object.assign({ mined:0, veins:0, tasks:0, buys:0, days:1 }, ST.stats||{});
  ST.tasks = ST.tasks || {}; ST.ach = ST.ach || {};

/* ================================ 4b. FIREBASE CLOUD SYNC ================================
   Saves all user data to Firebase Realtime Database keyed by Telegram user ID.
   Data persists across devices, app reinstalls, browser clears - tied to the TG ID forever.
   ================================================================================================== */
let FB_READY = false, FB_SYNCING = false, FB_UNLOAD = false;
function fbUserId(){
  if (USER && USER.id) return 'tg_' + USER.id;
  let anonId = LS.get('cp_anon_id', null);
  if (!anonId){ anonId = 'anon_' + uid(); LS.set('cp_anon_id', anonId); }
  return anonId;
}
function saveToFirebase(){
  if (!FB_READY || !window.FB || FB_SYNCING) return;
  const userId = fbUserId();
  if (!userId) return;
  try{
    const db = window.FB.db, r = window.FB.ref;
    window.FB.set(r(db, 'users/' + userId + '/state'), ST);
    window.FB.set(r(db, 'users/' + userId + '/lastSeen'), Date.now());
    if (USER){
      window.FB.set(r(db, 'users/' + userId + '/profile'), {
        name: USER.name || '', username: USER.username || '', photo: USER.photo || '',
        level: ST.level || 1, ore: ST.ore || 0, gems: ST.gems || 0
      });
    }
  }catch(e){}
}
async function syncFromFirebase(){
  if (!FB_READY || !window.FB) return;
  const userId = fbUserId();
  if (!userId) return;
  try{
    FB_SYNCING = true;
    const snap = await window.FB.get(window.FB.ref(window.FB.db, 'users/' + userId + '/state'));
    if (snap.exists()){
      const remote = snap.val();
      const remoteTs = remote.savedAt || 0;
      const localTs = ST.savedAt || 0;
      if (remoteTs > localTs){
        ST = deepMerge(newState(), remote);
        ensureState();
        closeAllTop(); go(VIEW, true);
        updChips(true);
        LS.set('cp_state', ST);
      }
    } else {
      saveToFirebase();
    }
  }catch(e){}finally{ FB_SYNCING = false; }
}
function listenFirebase(){
  if (!FB_READY || !window.FB) return;
  const userId = fbUserId();
  if (!userId) return;
  try{
    window.FB.onValue(window.FB.ref(window.FB.db, 'users/' + userId + '/state'), (snap) => {
      if (FB_SYNCING) return;
      if (snap.exists()){
        const remote = snap.val();
        const remoteTs = remote.savedAt || 0;
        if (remoteTs > (ST.savedAt || 0) + 2000){
          FB_SYNCING = true;
          ST = deepMerge(newState(), remote);
          ensureState();
          if (NAVSTACK.length === 0) go(VIEW, true);
          updChips(true);
          LS.set('cp_state', ST);
          FB_SYNCING = false;
        }
      }
    });
  }catch(e){}
}
function initFirebase(){
  if (FB_READY) return;
  if (!window.FB){ setTimeout(initFirebase, 300); return; }
  FB_READY = true;
  syncFromFirebase();
  listenFirebase();
  // Anti-multi-account & referral processing on load
  setTimeout(() => {
    checkMultiAccount();
    processReferral();
    registerReferralCode();
    listenReferrals();
    fetchReferrals();
  }, 500);
}

/* ================================ 4c. ANTI-MULTI-ACCOUNT & REFERRAL SYSTEM ================================
   RULE: One account per device. Multi-account on same device = blocked referrals.
   - Device ID is persistent in localStorage (same across Telegram account switches on same device)
   - Referral code = Telegram user ID (link: ?startapp=ref_{userId})
   - Multi-account detection: checks if device is already linked to another Telegram account
   - Multi-account users: referrals COUNT but CANNOT CLAIM rewards
   - Referrer info (name, username, avatar, balance) shown during loading screen
   ============================================================================================================ */

/* Get device ID - ALWAYS from localStorage (persistent across Telegram account switches) */
function getDeviceId(){
  // Always read from localStorage first - this is shared across Telegram accounts on same device
  let did = LS.get('cp_device_id', null);
  if (!did){
    const tgPlat = (TG && TG.initDataUnsafe && TG.initDataUnsafe.platform) ? TG.initDataUnsafe.platform : 'web';
    const ua = (navigator.userAgent || '').slice(0, 40);
    const sc = (screen.width || 0) + 'x' + (screen.height || 0);
    const seed = (tgPlat + ua + sc).replace(/[^a-zA-Z0-9]/g, '');
    did = 'dev_' + (seed.slice(0, 10) || 'web') + '_' + uid().slice(0, 6);
    LS.set('cp_device_id', did);
  }
  // Sync to state
  if (ST.friends && ST.friends.deviceId !== did){
    ST.friends.deviceId = did;
  }
  return did;
}

/* Multi-account check - first account stays normal, new accounts on same device get banned.
   Unbanned users can access until they trigger multi-account again. */
async function checkMultiAccount(){
  if (!USER || !USER.id) return;
  const F = CFG.friends || {};
  if (F.antiMultiAccount === false) return;
  if (!window.FB || !FB_READY){ setTimeout(checkMultiAccount, 1500); return; }
  const deviceId = getDeviceId();
  const tgUserId = USER.id;
  const fbUserId = 'tg_' + tgUserId;
  try{
    // 1. Check ban list from control panel
    const banSnap = await window.FB.get(window.FB.ref(window.FB.db, 'users/' + fbUserId + '/banned'));
    if (banSnap.exists() && banSnap.val() === true){
      ST.friends.blockedReferrals = true;
      ST.friends.blockedReason = 'Your account has been banned by the admin.';
      save();
      showMultiAccountBlock('Your account has been banned by the admin.', 'Admin ban');
      return;
    }

    // 2. Check if user was previously unbanned (skip device check for them)
    const unbanSnap = await window.FB.get(window.FB.ref(window.FB.db, 'users/' + fbUserId + '/unbanned'));
    const isUnbanned = unbanSnap.exists() && unbanSnap.val() === true;

    // 3. Check device -> user: is this device already used by another Telegram account?
    if (!isUnbanned){
      const devSnap = await window.FB.get(window.FB.ref(window.FB.db, 'devices/' + deviceId));
      if (devSnap.exists()){
        const devData = devSnap.val();
        const existingUser = devData.userId;
        if (existingUser && existingUser !== fbUserId){
          // MULTI-ACCOUNT: This device belongs to another account (the first/original account)
          // The NEW account (current user) gets banned. The FIRST account stays normal.
          ST.friends.blockedReferrals = true;
          ST.friends.blockedReason = 'This device is already linked to another account.';
          save();
          window.FB.set(window.FB.ref(window.FB.db, 'users/' + fbUserId + '/banned'), true);
          window.FB.set(window.FB.ref(window.FB.db, 'users/' + fbUserId + '/multiAccount'), {
            deviceUsedBy: existingUser, detectedAt: Date.now(), deviceId: deviceId, tgUserId: tgUserId
          });
          window.FB.set(window.FB.ref(window.FB.db, 'bannedUsers/' + fbUserId), {
            reason: 'multi_account_same_device', deviceId: deviceId, originalAccount: existingUser,
            detectedAt: Date.now(), tgUserId: tgUserId, userName: USER.name || ''
          });
          showMultiAccountBlock('This device is already linked to another account. Multi-accounting is not allowed.', existingUser);
          return;
        }
        // Same user on same device - just update lastSeen (first account stays normal)
        window.FB.set(window.FB.ref(window.FB.db, 'devices/' + deviceId), {
          userId: fbUserId, tgUserId: tgUserId, userName: USER.name || '',
          firstSeen: devData.firstSeen || Date.now(), lastSeen: Date.now()
        });
      } else {
        // New device - register it
        window.FB.set(window.FB.ref(window.FB.db, 'devices/' + deviceId), {
          userId: fbUserId, tgUserId: tgUserId, userName: USER.name || '',
          firstSeen: Date.now(), lastSeen: Date.now()
        });
        window.FB.set(window.FB.ref(window.FB.db, 'users/' + fbUserId + '/deviceId'), deviceId);
      }
    }

    // 4. All clear - user is either the first account, or unbanned
    ST.friends.blockedReferrals = false;
    ST.friends.blockedReason = '';
    save();
    // Clear unbanned flag (so next multi-account attempt gets caught)
    if (isUnbanned){
      window.FB.set(window.FB.ref(window.FB.db, 'users/' + fbUserId + '/unbanned'), false);
    }
    // Register/update device mapping
    window.FB.set(window.FB.ref(window.FB.db, 'users/' + fbUserId + '/deviceId'), deviceId);
    window.FB.set(window.FB.ref(window.FB.db, 'users/' + fbUserId + '/online'), {
      online: true, lastSeen: Date.now(), deviceId: deviceId
    });
  }catch(e){
    setTimeout(checkMultiAccount, 2000);
  }
}

/* Process referral during loading screen - ONLY uses start_param, shows welcome ONCE */
async function processReferral(){
  if (!USER || !USER.id) return;
  // Only process if not already processed (referralProcessed flag prevents repeat)
  if (ST.friends.referralProcessed) return;
  // ONLY use start_param from current Telegram launch - do NOT use stored state
  let refTgId = '';
  try{
    if (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param){
      const sp = String(TG.initDataUnsafe.start_param);
      if (sp.indexOf('ref_') === 0) refTgId = sp.slice(4);
    }
  }catch(e){}
  if (!refTgId) return; // No referral code in this launch
  const referrerTgId = parseInt(refTgId) || refTgId;
  if (String(referrerTgId) === String(USER.id)) return; // Can't refer yourself
  // Mark as processed immediately to prevent duplicate processing
  ST.friends.referredBy = String(referrerTgId);
  ST.friends.referredByTgId = referrerTgId;
  ST.friends.referralProcessed = true;
  save();

  // Fetch referrer's profile from Firebase
  if (window.FB && FB_READY){
    const refFbId = 'tg_' + referrerTgId;
    const myFbId = 'tg_' + USER.id;
    try{
      // Get referrer profile
      const profSnap = await window.FB.get(window.FB.ref(window.FB.db, 'users/' + refFbId + '/profile'));
      let refName = 'Miner', refUser = '', refAvatar = '', refBalance = 0;
      if (profSnap.exists()){
        const p = profSnap.val();
        refName = p.name || 'Miner';
        refUser = p.username || '';
        refAvatar = p.photo || '';
        refBalance = p.ore || 0;
        ST.friends.referrerName = refName;
        ST.friends.referrerUsername = refUser;
        ST.friends.referrerAvatar = refAvatar;
        save();
      }

      // Record referral with full tracking
      const blocked = ST.friends.blockedReferrals;
      const refEntry = {
        referredTgId: USER.id,
        referredFbId: myFbId,
        referredName: USER.name || '',
        referredUsername: USER.username || '',
        referredAvatar: USER.photo || '',
        referrerTgId: referrerTgId,
        referrerFbId: refFbId,
        referralCode: String(referrerTgId),
        ts: Date.now(),
        blocked: blocked,
        rewarded: !blocked,
        deviceId: getDeviceId()
      };
      // Store under referrer's referrals list (keyed by referred user's Telegram ID)
      window.FB.set(window.FB.ref(window.FB.db, 'referrals/' + refFbId + '/' + USER.id), refEntry);
      // Store under referred user's profile
      window.FB.set(window.FB.ref(window.FB.db, 'users/' + myFbId + '/referredBy'), {
        tgId: referrerTgId, name: refName, username: refUser, avatar: refAvatar, ts: Date.now(), blocked: blocked
      });
      // Increment referrer's invited count
      const invSnap = await window.FB.get(window.FB.ref(window.FB.db, 'users/' + refFbId + '/invitedCount'));
      const cur = invSnap.exists() ? (invSnap.val() || 0) : 0;
      window.FB.set(window.FB.ref(window.FB.db, 'users/' + refFbId + '/invitedCount'), cur + 1);

      // Show referrer info during loading screen - ONLY ONCE
      showReferralWelcome(refName, refUser, refAvatar, refBalance, blocked);
    }catch(e){}
  }
}

/* Claim referral reward */
function claimReferralReward(){
  if (ST.friends.blockedReferrals){
    toast('Blocked: multi-account detected on this device', 'err', 'alert'); sfx('err');
    return;
  }
  if ((ST.friends.invited || 0) <= 0){ toast('No referrals to claim', 'info'); return; }
  const F = CFG.friends || {};
  const rewardOre = F.referralTonReward ? F.referralTonReward * (CFG.economy.orePerTon || 20000) : (F.bonusOre || 200);
  const claimable = ST.friends.invited || 0;
  const total = rewardOre * claimable;
  ST.ore += total; ST.stats.mined += total;
  ST.friends.earnedOre = (ST.friends.earnedOre || 0) + total;
  ST.friends.invited = 0;
  sfx('coin'); hapOk(); confettiAt(140, 140, 60);
  toast('Claimed: +' + fmt(total) + ' ORE (' + fmtTon(F.referralTonReward * claimable) + ' TON)', 'gold', 'gift');
  save(); updChips(true);
}

/* Listen for new referrals in real-time */
let REFERRALS_LIST = [];
async function fetchReferrals(){
  if (!window.FB || !FB_READY || !USER || !USER.id) return;
  const fbUserId = 'tg_' + USER.id;
  try{
    const snap = await window.FB.get(window.FB.ref(window.FB.db, 'referrals/' + fbUserId));
    if (snap.exists()){
      const refs = snap.val();
      REFERRALS_LIST = Object.values(refs).sort((a,b) => (b.ts||0) - (a.ts||0));
      if (VIEW === 'friends') go('friends', true);
    } else {
      REFERRALS_LIST = [];
    }
  }catch(e){}
}
function listenReferrals(){
  if (!window.FB || !FB_READY || !USER || !USER.id) return;
  const fbUserId = 'tg_' + USER.id;
  try{
    window.FB.onValue(window.FB.ref(window.FB.db, 'referrals/' + fbUserId), (snap) => {
      if (snap.exists()){
        const refs = snap.val();
        REFERRALS_LIST = Object.values(refs).sort((a,b) => (b.ts||0) - (a.ts||0));
        const unblocked = Object.values(refs).filter(r => !r.blocked).length;
        const total = Object.keys(refs).length;
        const old = ST.friends.invited || 0;
        ST.friends.invited = unblocked;
        ST.friends.totalInvited = total;
        save();
        if (VIEW === 'friends') go('friends', true);
        if (unblocked > old){
          toast('New referral joined! +' + (CFG.friends.referralTonReward || 0.01) + ' TON ready to claim', 'gold', 'friends');
        }
      } else {
        REFERRALS_LIST = [];
      }
    });
    // Listen for ban/unban changes in real-time
    window.FB.onValue(window.FB.ref(window.FB.db, 'users/' + fbUserId + '/banned'), (snap) => {
      const isBanned = snap.exists() && snap.val() === true;
      if (isBanned && !ST.friends.blockedReferrals){
        // BANNED in real-time
        ST.friends.blockedReferrals = true;
        ST.friends.blockedReason = 'Your account has been banned by the admin.';
        save();
        showMultiAccountBlock('Your account has been banned by the admin.', 'Admin ban');
      } else if (!isBanned && ST.friends.blockedReferrals){
        // UNBANNED in real-time - reload the app
        ST.friends.blockedReferrals = false;
        ST.friends.blockedReason = '';
        saveNow();
        location.reload();
      }
    });
    // Also listen for unbanned flag
    window.FB.onValue(window.FB.ref(window.FB.db, 'users/' + fbUserId + '/unbanned'), (snap) => {
      if (snap.exists() && snap.val() === true && ST.friends.blockedReferrals){
        ST.friends.blockedReferrals = false;
        ST.friends.blockedReason = '';
        saveNow();
        location.reload();
      }
    });
  }catch(e){}
}

/* ================================ 4d. MANDATORY TASKS GATE ================================
   Users must join required Telegram channels before they can use the app.
   Checks subscription via Telegram Bot API. If user leaves a channel, gate reappears.
   ================================================================================================== */

let MANDATORY_CHECKING = false, MANDATORY_GATE_SHOWN = false;

/* Check if user is subscribed to a channel via Telegram Bot API */
async function checkChannelSubscription(channelUsername, userId){
  const MT = CFG.mandatoryTasks;
  if (!MT || !MT.enabled || !MT.botApiKey || !userId) return true; // Skip if disabled
  const token = MT.botApiKey;
  const apiUrl = 'https://api.telegram.org/bot' + token + '/getChatMember?chat_id=@' + channelUsername + '&user_id=' + userId;
  // Try direct fetch first (works in some Telegram WebViews)
  try{
    const resp = await fetch(apiUrl, { signal: AbortSignal.timeout(8000) });
    if (resp.ok){
      const data = await resp.json();
      if (data.ok && data.result){
        const st = data.result.status;
        return st === 'member' || st === 'administrator' || st === 'creator';
      }
    }
  }catch(e){}
  // Fallback: try CORS proxy
  try{
    const proxyUrl = 'https://corsproxy.io/?url=' + encodeURIComponent(apiUrl);
    const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
    if (resp.ok){
      const data = await resp.json();
      if (data.ok && data.result){
        const st = data.result.status;
        return st === 'member' || st === 'administrator' || st === 'creator';
      }
    }
  }catch(e){}
  // Second fallback: allorigins
  try{
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(apiUrl);
    const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
    if (resp.ok){
      const data = await resp.json();
      if (data.ok && data.result){
        const st = data.result.status;
        return st === 'member' || st === 'administrator' || st === 'creator';
      }
    }
  }catch(e){}
  return false; // Assume not joined if all checks fail
}

/* Check all mandatory channels */
async function checkAllMandatoryTasks(){
  const MT = CFG.mandatoryTasks;
  if (!MT || !MT.enabled) return true;
  if (!USER || !USER.id) return true; // Skip if no user
  if (MANDATORY_CHECKING) return ST.mandatoryTasksDone;
  MANDATORY_CHECKING = true;
  try{
    const results = await Promise.all(
      (MT.channels || []).map(ch => checkChannelSubscription(ch.username, USER.id))
    );
    const allJoined = results.every(r => r === true);
    const wasDone = ST.mandatoryTasksDone;
    ST.mandatoryTasksDone = allJoined;
    save();
    if (allJoined && !wasDone){
      // User just completed all tasks
      hideMandatoryGate();
      hapOk();
      toast('Channels joined! You can start mining now.', 'ok', 'check');
    } else if (!allJoined && wasDone){
      // User left a channel - show gate immediately
      showMandatoryGate();
    } else if (!allJoined && MANDATORY_GATE_SHOWN){
      // Still not joined - update gate status
      updateMandatoryGateStatus(results);
    }
    return allJoined;
  }catch(e){
    return ST.mandatoryTasksDone;
  }finally{
    MANDATORY_CHECKING = false;
  }
}

/* Start periodic mandatory task checking */
let MANDATORY_INTERVAL = null;
function startMandatoryCheckInterval(){
  const MT = CFG.mandatoryTasks;
  if (!MT || !MT.enabled) return;
  if (MANDATORY_INTERVAL) clearInterval(MANDATORY_INTERVAL);
  const interval = (MT.checkIntervalSec || 30) * 1000;
  MANDATORY_INTERVAL = setInterval(() => {
    checkAllMandatoryTasks().then(done => {
      if (!done && !MANDATORY_GATE_SHOWN){
        showMandatoryGate();
      }
    });
  }, interval);
}

function gearVal(k){ return gearList().reduce((s,g) => s + (g[k]||0), 0); }
function boostMult(){ return (ST.boostUntil||0) > Date.now() ? (ST.boostMult||1) : 1; }
function minerPower(m, def){ return (def.power||0) * (1 + (CFG.mining.upgradePowerStep||0.22) * ((m.level||1) - 1)); }

/* ---------- EARNINGS: purchase boost, daily gram, refund ---------- */
function earningsCfg(){ return CFG.earnings || { enabled:false }; }
function getActivePurchaseBoosts(){
  const E = earningsCfg();
  if (E.enabled === false || !E.purchaseBoostPercent) return [];
  const now = Date.now();
  return (ST.earnings.activeBoosts || []).filter(b => !b.refunded && b.expiresAt > now);
}
function getPurchaseBoostMult(){
  const E = earningsCfg();
  if (E.enabled === false || !E.purchaseBoostPercent) return 0;
  const active = getActivePurchaseBoosts();
  return active.length * (E.purchaseBoostPercent / 100);
}
function getPurchaseBoostPct(){
  return Math.round(getPurchaseBoostMult() * 100);
}
function addPurchaseBoost(amountTon){
  const E = earningsCfg();
  if (E.enabled === false || !E.purchaseBoostPercent || !E.purchaseBoostDays) return;
  if (amountTon <= 0) return;
  ST.earnings = ST.earnings || { lastDailyGram:0, activeBoosts:[], refundBalance:0, totalPurchased:0 };
  ST.earnings.activeBoosts.push({
    id: uid(), purchaseTs: Date.now(), amountTon: amountTon,
    expiresAt: Date.now() + E.purchaseBoostDays * 24 * 3600 * 1000, refunded: false
  });
  ST.earnings.totalPurchased = (ST.earnings.totalPurchased || 0) + amountTon;
}
function checkExpiredBoosts(){
  const E = earningsCfg();
  if (E.enabled === false) return;
  if (!ST.earnings || !ST.earnings.activeBoosts) return;
  const now = Date.now();
  let refunded = 0, count = 0;
  ST.earnings.activeBoosts.forEach(b => {
    if (!b.refunded && b.expiresAt <= now){
      b.refunded = true;
      if (E.refundAfterExpiry !== false){
        ST.earnings.refundBalance = (ST.earnings.refundBalance || 0) + b.amountTon;
        refunded += b.amountTon; count++;
      }
    }
  });
  // Clean up old refunded boosts older than 7 days
  ST.earnings.activeBoosts = ST.earnings.activeBoosts.filter(b => !b.refunded || (now - b.expiresAt < 7 * 86400000));
  if (refunded > 0){
    toast(fmtTon(refunded) + ' TON refunded to your balance' + (count > 1 ? ' (' + count + ' boosts expired)' : ''), 'gold', 'gift');
    save();
  }
}
function claimDailyGram(){
  const E = earningsCfg();
  if (E.enabled === false || !E.dailyGramReward || E.dailyGramReward <= 0) return;
  if (!ST.earnings.freeMinerActivated) return; // Requires free miner activation
  const now = Date.now();
  if (now - (ST.earnings.lastDailyGram || 0) < 24 * 3600 * 1000) return;
  const gramOre = E.dailyGramReward * (CFG.economy.orePerTon || 20000);
  ST.ore += gramOre;
  ST.stats.mined += gramOre;
  ST.earnings.lastDailyGram = now;
  sfx('coin'); hapOk();
  toast('Daily gram reward: +' + fmt(gramOre) + ' ORE (' + E.dailyGramReward + ' gram)', 'gold', 'gift');
  save(); updChips(true);
}
/* Format miner transaction comment: {minerId}_{userId} */
function minerTxComment(minerId){
  const uid = USER && USER.id ? USER.id : 'anon';
  return minerId + '_' + uid;
}
/* Calculate miner earnings for display */
function minerEarnings(power){
  const rate = CFG.economy.orePerTon || 20000;
  const perSec = power;
  const perHour = perSec * 3600;
  const perDay = perHour * 24;
  const perWeek = perDay * 7;
  const perMonth = perDay * 30;
  return {
    perHour: perHour, perDay: perDay, perWeek: perWeek, perMonth: perMonth,
    tonHour: perHour / rate, tonDay: perDay / rate, tonWeek: perWeek / rate, tonMonth: perMonth / rate
  };
}

function totalRate(){
  const md = MAP(), pb = gearVal('bonus'), bm = boostMult();
  let sum = 0;
  ST.fields.forEach(f => {
    if (!f.unlocked || !f.miner) return;
    const inst = ST.miners[f.miner]; if (!inst) return;
    const def = CFG.miners.find(d => d.id === inst.id); if (!def) return;
    sum += minerPower(inst, def);
  });
  const baseRate = sum * (md ? md.mult : 1) * (1 + pb) * bm;
  const purchaseBoost = getPurchaseBoostMult();
  return baseRate * (1 + purchaseBoost);
}
function ownedCount(id){ let n = 0; for (const k in ST.miners) if (ST.miners[k].id === id) n++; return n; }
function levelNeed(l){ return Math.round(120 * Math.pow(l, 1.5)); }
function equipBest(slot){
  const own = CFG.gear.filter(g => g.slot === slot && ST.gearOwned.includes(g.id));
  if (!own.length){ delete ST.gearEquipped[slot]; return; }
  const score = g => (g.bonus||0) + (g.bonusLoot||0) + (g.offlineHours||0)*0.01;
  own.sort((a,b) => score(b) - score(a));
  ST.gearEquipped[slot] = own[0].id;
}
/* Upgrade cost in TON - miners can only be upgraded with TON */
function upgradeCost(def, lvl){
  if (def.noUpgrade || def.free) return -1; // Free miners cannot be upgraded
  // Base TON cost proportional to miner power, increases per level
  const baseTon = Math.max(0.01, (def.power || 1) * 0.002);
  return Math.round(baseTon * Math.pow(CFG.mining.upgradeCostMult||1.35, (lvl||1) - 1) * 1000) / 1000;
}
function addMiner(def){
  const u = 'u' + (ST.nextUid++);
  ST.miners[u] = { id: def.id, level: 1, field: null };
  const free = ST.fields.find(f => f.unlocked && !f.miner);
  if (free){ free.miner = u; ST.miners[u].field = ST.fields.indexOf(free); }
  return u;
}

let AC = null;
function sfx(name){
  if (!prefs().sfx) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') return;
    const t = AC.currentTime;
    const seq = {
      tap:[[560,.05]], ok:[[660,.07],[880,.09]], buy:[[720,.06],[980,.06],[1240,.11]],
      err:[[210,.13]], level:[[520,.08],[660,.08],[880,.1],[1180,.14]], coin:[[1320,.05],[1560,.06]]
    }[name] || [[520,.05]];
    seq.forEach((sf, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = sf[0];
      g.gain.setValueAtTime(0.0001, t + i*.07);
      g.gain.exponentialRampToValueAtTime(.11, t + i*.07 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + i*.07 + sf[1]);
      o.connect(g); g.connect(AC.destination);
      o.start(t + i*.07); o.stop(t + i*.07 + sf[1] + .03);
    });
  }catch(e){}
}
function toast(msg, type, icon){
  const wrap = $('#toasts'); if (!wrap) return;
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'info');

  t.innerHTML = I(ic) + '<span>' + msg + '</span>';
  wrap.appendChild(t);

  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2600);
}
/* confetti */
const FX = { c:null, ctx:null, ps:[], running:false };
function fxInit(){
  FX.c = $('#fx'); if (!FX.c) return;
  FX.ctx = FX.c.getContext('2d');
  const size = () => { const r = $('#appwrap').getBoundingClientRect(); FX.c.width = r.width * 2; FX.c.height = r.height * 2; FX.ctx.scale(2,2); };
  size();
  window.addEventListener('resize', size);
}
function confettiAt(x, y, n){
  n = n || 70;
  const cols = ['#f5b942','#22d3ee','#a78bfa','#4ade80','#f87171','#ffffff'];
  for (let i = 0; i < n; i++){
    FX.ps.push({ x, y, vx: rnd(-4.2,4.2), vy: rnd(-7.5,-2), g: .18, life: rnd(45,80), c: cols[ri(0,cols.length-1)], s: rnd(2.4,5.2), r: rnd(0,Math.PI*2), vr: rnd(-.2,.2) });
  }
  if (!FX.running){ FX.running = true; fxLoop(); }
}
function confettiEl(el, n){
  if (!el || !FX.c) return;
  const wr = $('#appwrap').getBoundingClientRect(), r = el.getBoundingClientRect();
  confettiAt(r.left - wr.left + r.width/2, r.top - wr.top + r.height/2, n);
}
function fxLoop(){
  const ctx = FX.ctx; if (!ctx){ FX.running = false; return; }
  ctx.clearRect(0, 0, FX.c.width, FX.c.height);
  FX.ps = FX.ps.filter(p => p.life > 0);
  FX.ps.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.globalAlpha = clamp(p.life/40, 0, 1);
    ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s * .62);
    ctx.restore();
  });
  if (FX.ps.length) requestAnimationFrame(fxLoop);
  else { FX.running = false; ctx.clearRect(0, 0, FX.c.width, FX.c.height); }
}

const TASK_ICON = { channel:'send', social:'share', site:'ext', link:'link', join:'friends' };
function taskState(t){
  const stt = ST.tasks[t.id] || {};
  const now = Date.now();
  const vd = (CFG.tasksCfg.verifySec || 10) * 1000;
  if (t.type === 'daily' || (t.cooldownH|0) > 0){
    const cd = (t.type === 'daily' ? 24 : (t.cooldownH|0)) * 3600 * 1000;
    const ready = !stt.last || now - stt.last >= cd;
    return { mode: ready ? 'claim' : 'wait', cdUntil: (stt.last||0) + cd, label: ready ? 'Claim' : 'Ready in' };
  }
  if (stt.done) return { mode:'done' };
  if (!stt.start) return { mode:'start' };
  if (now - stt.start < vd) return { mode:'verify', cdUntil: stt.start + vd };
  return { mode:'claim' };
}

      else if (ts.mode === 'verify') btn = '<button class="btn sm ghost" disabled>' + I('clock') + '<span data-cd="' + ts.cdUntil + '">--</span></button>';
      else if (ts.mode === 'claim') btn = '<button class="btn sm pulse" data-act="task-claim" data-id="' + t.id + '">' + I('gift') + 'Claim</button>';
      else if (ts.mode === 'wait') btn = '<button class="btn sm ghost" disabled>' + I('clock') + '<span data-cd="' + ts.cdUntil + '">--</span></button>';

      + '<div class="wrow divd"><span class="mut">You receive</span><b class="num" id="swapOutTxt" style="color:var(--good)">0 ' + (o2g ? esc(G) : esc(O)) + '</b></div>'

function bindSwapCalc(){
  const amt = $('#swapIn'); if (!amt) return;
  const upd = () => {
    SWAP_KEEP.amt = amt.value;
    const O = CFG.currency.ore.name, G = CFG.currency.gem.name;
    const r = swapRates();
    const v = Math.max(0, Number(amt.value)||0);
    const fee = v * r.fee / 100;
    const out = r.rate > 0 ? (r.o2g ? Math.floor((v - fee) / r.rate) : Math.floor((v - fee) * r.rate)) : 0;
    const f = $('#swapFeeTxt'), o = $('#swapOutTxt');
    if (f) f.textContent = fmt(fee) + ' ' + (r.o2g ? O : G);
    if (o) o.textContent = fmt(out) + ' ' + (r.o2g ? G : O);
  };
  amt.addEventListener('input', upd); upd();
}
function doSwap(el){
  const SW = CFG.swap || {};
  if (SW.enabled === false) return;
  const O = CFG.currency.ore.name, G = CFG.currency.gem.name;
  const r = swapRates();
  if (r.rate <= 0){ toast('Swap rate is not configured', 'err'); sfx('err'); return; }
  const amt = Math.floor(Number(($('#swapIn')||{}).value)||0);
  if (r.o2g){
    if (amt < (SW.minOre||1)){ toast('Minimum swap is ' + fmt(SW.minOre||1) + ' ' + O, 'err'); sfx('err'); return; }
    if (amt > ST.ore){ toast('Not enough ' + O, 'err', 'ore'); sfx('err'); return; }
    const fee = amt * r.fee / 100;
    const out = Math.floor((amt - fee) / r.rate);
    if (out < 1){ toast('Amount too small to swap', 'err'); sfx('err'); return; }
    ST.ore -= amt; ST.gems += out;
    swapHistory(O + ' to ' + G, fmt(amt) + ' ' + O + ' to ' + fmt(out) + ' ' + G);
    toast('Swapped ' + fmt(amt) + ' ' + O + ' for ' + fmt(out) + ' ' + G, 'gold', 'refresh');
  } else {
    if (amt < (SW.minGem||1)){ toast('Minimum swap is ' + fmt(SW.minGem||1) + ' ' + G, 'err'); sfx('err'); return; }
    if (amt > ST.gems){ toast('Not enough ' + G, 'err', 'gem'); sfx('err'); return; }
    const fee = amt * r.fee / 100;
    const out = Math.floor((amt - fee) * r.rate);
    if (out < 1){ toast('Amount too small to swap', 'err'); sfx('err'); return; }
    ST.gems -= amt; ST.ore += out;
    swapHistory(G + ' to ' + O, fmt(amt) + ' ' + G + ' to ' + fmt(out) + ' ' + O);
    toast('Swapped ' + fmt(amt) + ' ' + G + ' for ' + fmt(out) + ' ' + O, 'gold', 'refresh');
  }
  sfx('buy'); hapOk(); confettiEl(el, 40);
  save(); updChips(true);
  SWAP_KEEP.amt = '';
  // Refresh swap page if open, otherwise wallet
  const swapPg = NAVSTACK.find(n => n.id === 'swap');
  if (swapPg){ swapPg.el.innerHTML = PAGES.swap(); bindSwapCalc(swapPg.el); }
  else refreshWallet();
  checkAch();
}

/* ================================ 15. ACTIONS ================================ */
const ACT = {
  'open-view': d => { closeAllTop(); go(d.v); },
  'open-page': d => openPage(d.p),
  /* Mandatory tasks gate */
  'mt-join': (d) => {
    const url = d.url;
    if (url){ openLink(url); }
  },
  'mt-check': async (d, el) => {
    if (el){ el.disabled = true; el.textContent = 'Checking...'; }
    const msg = $('#mtMsg');
    if (msg) msg.textContent = '';
    const done = await checkAllMandatoryTasks();
    if (done){
      if (el){ el.textContent = 'Success!'; }
      hideMandatoryGate();
      hapOk();
      toast('Welcome! You can start mining now.', 'ok', 'check');
      // Re-render the app
      renderTopbar(); renderNav(); go('mine');
      startMandatoryCheckInterval();
    } else {
      if (el){ el.disabled = false; el.textContent = 'Check & Start Mining'; }
      if (msg) msg.textContent = 'Please join both channels first, then click check again.';
      sfx('err');
    }
  },
  'close-top': (d, el) => { const after = d.after; closeTop(); if (after){ STORE_TAB = after === 'store' ? 'miners' : STORE_TAB; go(after); } },
  'confirm-ok': () => { closeTop(); if (CONFIRM_CB){ const cb = CONFIRM_CB; CONFIRM_CB = null; cb(); } },
  'store-tab': d => { STORE_TAB = d.t; go('store', true); },
  'copy': (d) => {
    if (d.copySrc){ const el = $('#' + d.copySrc); copyText(el ? el.value : '', 'Copied'); }
    else copyText(d.copy || '', 'Copied');
  },
  'support': () => openLink(CFG.app.supportUrl || 'https://telegram.org'),
  'exit-app': () => confirmSheet('Exit app?', 'You will return to Telegram. Your crew keeps mining in the background.', 'Exit', () => {
    try{ if (TG && TG.close) TG.close(); }catch(e){}
    if (!TG) toast('Available inside Telegram only', 'info');
  }, true),
  /* tasks */
  'task-start': (d, el) => {
    const t = CFG.tasks.find(x => x.id === d.id); if (!t) return;
    const stt = ST.tasks[t.id] || (ST.tasks[t.id] = {});
    stt.start = Date.now(); saveNow(); sfx('tap'); hap('light');
    openLink(t.url);
    go('tasks', true);
  },
  'task-claim': (d, el) => {
    const t = CFG.tasks.find(x => x.id === d.id); if (!t) return;
    const stt = ST.tasks[t.id] || (ST.tasks[t.id] = {});
    const now = Date.now();
    if (t.type === 'daily' || (t.cooldownH|0) > 0){
      const cd = (t.type === 'daily' ? 24 : (t.cooldownH|0)) * 3600 * 1000;
      if (stt.last && now - stt.last < cd) return;
      stt.last = now;
    } else {
      const vd = (CFG.tasksCfg.verifySec || 10) * 1000;
      if (!stt.start || stt.done || now - stt.start < vd) return;
      stt.done = true;
    }
    if (t.rewardOre){ ST.ore += t.rewardOre; ST.stats.mined += t.rewardOre; }
    if (t.rewardGem) ST.gems += t.rewardGem;
    ST.stats.tasks++;
    save(); hapOk(); sfx('buy');
    confettiEl(el, 46);
    toast('Reward claimed: +' + fmt(t.rewardOre||0) + ' ' + CFG.currency.ore.name + (t.rewardGem ? ' +' + t.rewardGem + ' ' + CFG.currency.gem.name : ''), 'gold', 'gift');
    renderNav(); go('tasks', true); checkAch();
  },
  /* mine interactions */
  'field-tap': d => {
    const f = ST.fields[+d.i]; if (!f) return;
    if (!f.unlocked){ toast('Reach level ' + f.req + ' to unlock this dig site', 'info', 'lock'); return; }
    hap('light');
    if (!f.miner) sheetAssign(+d.i); else sheetField(+d.i);
  },
  'assign': d => {
    const f = ST.fields[+d.i], u = d.u;
    if (f && ST.miners[u] && !ST.miners[u].field){
      f.miner = u; ST.miners[u].field = +d.i;
      sfx('ok'); hapOk(); toast('Miner assigned to site ' + (+d.i + 1), 'ok', 'check');
      save(); closeAllTop(); go('mine', true);
    }
  },
  'unassign': d => {
    const f = ST.fields[+d.i], u = d.u;
    if (f && ST.miners[u]){ f.miner = null; ST.miners[u].field = null; save(); closeAllTop(); go('mine', true); }
  },
  'upgrade-miner': (d, el) => {
    const inst = ST.miners[d.u]; if (!inst) return;
    const def = CFG.miners.find(x => x.id === inst.id); if (!def) return;
    if (def.noUpgrade || def.free){ toast('Free miners cannot be upgraded', 'err'); sfx('err'); return; }
    const cost = upgradeCost(def, inst.level);
    if (cost <= 0){ toast('Cannot upgrade this miner', 'err'); sfx('err'); return; }
    // Upgrade via TON payment
    sheetPayment({ kind:'upgrade', id: def.id, amountTon: cost, label: 'Upgrade ' + def.name + ' L' + ((inst.level||1)+1), minerUid: d.u });
  },
  'map-open': () => sheetMaps(),
  'map-switch': d => {
    if (ST.mapsOwned && ST.mapsOwned.includes(d.id)){ ST.mapId = d.id; sfx('ok'); save(); closeAllTop(); go('mine', true); toast('Moved to ' + (MAP().name), 'ok', 'layers'); }
  },
  'map-unlock': (d, el) => {
    const m = CFG.maps.find(x => x.id === d.id); if (!m) return;
    if (ST.level < m.reqLevel){ toast('Reach level ' + m.reqLevel + ' first', 'err', 'lock'); return; }
    if (ST.ore < (m.costOre||0)){ toast('Not enough ' + CFG.currency.ore.name, 'err', 'ore'); sfx('err'); return; }
    ST.ore -= m.costOre||0;
    ST.mapsOwned = ST.mapsOwned || CFG.maps.filter(x => (x.costOre||0) === 0).map(x => x.id);
    ST.mapsOwned.push(m.id); ST.mapId = m.id;
    sfx('level'); hapOk(); confettiEl(el, 60);
    toast('New map unlocked: ' + m.name, 'gold', 'layers');
    save(); closeAllTop(); go('mine', true); checkAch();
  },
  'boost-open': () => {
    const b = (CFG.mining.boosts||[]).find(x => x.enabled !== false);
    if (b) sheetBoost(b.id); else toast('No boosts configured', 'info');
  },
  'boost-buy': d => sheetBoost(d.id),
  'boost-gem': (d, el) => {
    const b = (CFG.mining.boosts||[]).find(x => x.id === d.id); if (!b) return;
    if (ST.gems < (b.priceGem||0)){ toast('Not enough ' + CFG.currency.gem.name, 'err', 'gem'); sfx('err'); return; }
    ST.gems -= b.priceGem||0;
    ST.boostUntil = Date.now() + b.minutes*60000; ST.boostMult = b.mult;
    sfx('buy'); hapOk(); confettiEl(el, 44);
    toast(b.name + ' active for ' + b.minutes + ' min', 'ok', 'zap');
    save(); closeAllTop(); go('mine', true);
  },
  'boost-ton': d => {
    const b = (CFG.mining.boosts||[]).find(x => x.id === d.id); if (!b) return;
    sheetPayment({ kind:'boost', id:b.id, amountTon:b.priceTon||0, label:b.name });
  },
  /* store purchases */
  'buy': (d, el) => buyItem(d.kind, d.id, el),
  /* Activate free starter miner - gives 0.01 gram/day */
  'activate-free-miner': (d, el) => {
    if (ST.earnings.freeMinerActivated){
      toast('Free miner already activated', 'info');
      return;
    }
    const freeDef = CFG.miners.find(m => m.free === true);
    if (!freeDef){
      toast('Free miner not available', 'err'); return;
    }
    addMiner(freeDef);
    ST.earnings.freeMinerActivated = true;
    sfx('level'); hapOk(); confettiEl(el, 50);
    toast('Free Starter Miner activated! Mines ~0.01 TON/day for free', 'gold', 'gift');
    save(); go('store', true); updChips(true);
  },
  /* daily */
  'daily-claim': (d, el) => {
    const now = Date.now();
