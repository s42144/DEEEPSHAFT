<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepShaft - Control Panel</title>
<script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --bg2:#0b1120; --panel:#0f1828; --card:#131f33; --card2:#18283f; --line:#23344f;
  --txt:#eaf0fb; --mut:#8b98ad; --mut2:#5f6b7e;
  --accent:#f5b942; --accent2:#22d3ee; --accent3:#a78bfa;
  --good:#34d399; --bad:#f87171; --warn:#fbbf24; --info:#60a5fa; --gem:#e879f9;
  --r:14px; --rsm:10px; --rlg:18px;
  --side-w:248px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.mut2{color:var(--mut2)}
.sm{font-size:12px}.xs{font-size:11px}.xl{font-size:20px}.xxl{font-size:28px}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}.center{align-items:center}.col{display:flex;flex-direction:column;gap:8px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.gap4{gap:4px}.gap6{gap:6px}.gap10{gap:10px}.gap14{gap:14px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt20{margin-top:20px}.mb10{margin-bottom:10px}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.ic14{width:14px;height:14px}.ic16{width:16px;height:16px}.ic20{width:20px;height:20px}.ic24{width:24px;height:24px}
svg{display:block}

/* ---------- Layout ---------- */
#app{display:flex;height:100vh;height:100dvh}
#side{width:var(--side-w);flex:none;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#sideHead{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.side-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--accent),#ffd98a);display:flex;align-items:center;justify-content:center;color:#241703;flex:none;box-shadow:0 6px 18px rgba(245,185,66,.3)}
.side-title{font-weight:800;font-size:14px;letter-spacing:.06em;line-height:1.1}
.side-sub{font-size:10px;color:var(--mut);letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
#sideNav{flex:1;overflow-y:auto;padding:10px 8px 16px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#sideNav::-webkit-scrollbar{width:6px}
#sideNav::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.nav-group{margin-top:10px}
.nav-group-lbl{font-size:9.5px;font-weight:800;letter-spacing:.18em;color:var(--mut2);text-transform:uppercase;padding:8px 10px 5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--mut);font-size:13px;font-weight:600;transition:background .15s,color .15s;border:none;background:none;width:100%;text-align:left;position:relative}
.nav-item:hover{background:var(--card);color:var(--txt)}
.nav-item.on{background:linear-gradient(90deg,rgba(245,185,66,.16),rgba(245,185,66,.02));color:var(--accent)}
.nav-item.on:before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.nav-item .ic{color:currentColor}
.nav-badge{margin-left:auto;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:99px;min-width:18px;text-align:center}
.nav-badge.gold{background:var(--accent);color:#241703}
.nav-badge.info{background:var(--info)}
#sideFoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:11px}
.fbdot{width:8px;height:8px;border-radius:50%;background:var(--mut2);flex:none}
.fbdot.on{background:var(--good);box-shadow:0 0 8px var(--good)}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(11,17,32,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#tbMenu{display:none;background:none;border:none;color:var(--mut);cursor:pointer;padding:6px;border-radius:8px}
#tbMenu:hover{background:var(--card)}
#tbTitle{font-size:16px;font-weight:800;letter-spacing:.01em}
#tbSub{font-size:11px;color:var(--mut);margin-left:2px}
#tbRight{margin-left:auto;display:flex;align-items:center;gap:8px}
#content{flex:1;overflow-y:auto;padding:20px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#content::-webkit-scrollbar{width:8px}
#content::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(700px 480px at 50% 30%,#16223c,var(--bg));padding:20px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:30px 26px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.login-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(140deg,var(--accent),#ffd98a);display:flex;align-items:center;justify-content:center;color:#241703;margin:0 auto 16px;box-shadow:0 10px 28px rgba(245,185,66,.35)}
.login-title{text-align:center;font-size:20px;font-weight:800;letter-spacing:.04em}
.login-sub{text-align:center;color:var(--mut);font-size:12px;margin-top:4px;margin-bottom:22px;letter-spacing:.1em;text-transform:uppercase}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;font-weight:700;font-size:13px;color:#241703;border-radius:11px;padding:10px 16px;background:linear-gradient(135deg,var(--accent),#ffd98a);box-shadow:0 5px 16px rgba(245,185,66,.22);transition:transform .12s,filter .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:disabled{filter:grayscale(.7) brightness(.55);pointer-events:none}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
.btn.cyan{background:linear-gradient(135deg,var(--accent2),#0ea5e9);color:#032530;box-shadow:0 5px 16px rgba(34,211,238,.22)}
.btn.green{background:linear-gradient(135deg,var(--good),#059669);color:#04261a;box-shadow:0 5px 16px rgba(52,211,153,.22)}
.btn.red{background:linear-gradient(135deg,var(--bad),#dc2626);color:#2b0606;box-shadow:0 5px 16px rgba(248,113,113,.22)}
.btn.purple{background:linear-gradient(135deg,var(--accent3),#7c3aed);color:#1e0a3a;box-shadow:0 5px 16px rgba(167,139,250,.22)}
.btn.sm{padding:7px 11px;font-size:11.5px;border-radius:9px}
.btn.xs{padding:5px 8px;font-size:10.5px;border-radius:8px}
.btn.block{width:100%}
.btn.icon{padding:8px;border-radius:9px}
.btn:disabled{opacity:.5}

/* ---------- Cards ---------- */
.card{background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--rlg);padding:16px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h .ic{color:var(--accent)}
.card-title{font-size:14px;font-weight:800;letter-spacing:.01em;flex:1}
.stitle{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.stitle:first-child{margin-top:4px}
.stitle .ic{color:var(--accent2)}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1100px){.g5,.g6{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.g4,.g5,.g6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.g2,.g3,.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.g2,.g3,.g4,.g5,.g6{grid-template-columns:1fr}}

/* ---------- Stat cards ---------- */
.stat{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;min-width:0}
.stat:before{content:'';position:absolute;top:-20px;right:-20px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(245,185,66,.1),transparent 70%)}
.stat-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(245,185,66,.12);color:var(--accent);margin-bottom:10px}
.stat-ico.cyan{background:rgba(34,211,238,.12);color:var(--accent2)}
.stat-ico.green{background:rgba(52,211,153,.12);color:var(--good)}
.stat-ico.red{background:rgba(248,113,113,.12);color:var(--bad)}
.stat-ico.purple{background:rgba(167,139,250,.12);color:var(--accent3)}
.stat-ico.gem{background:rgba(232,121,249,.12);color:var(--gem)}
.stat-ico.info{background:rgba(96,165,250,.12);color:var(--info)}
.stat-lbl{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat-sub{font-size:10.5px;color:var(--mut2);margin-top:5px;font-weight:600}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
table.tbl th{text-align:left;padding:11px 12px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);background:var(--card2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.tbl td{padding:11px 12px;border-bottom:1px solid rgba(35,52,79,.5);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:rgba(35,52,79,.25)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase}
.tag.good{background:rgba(52,211,153,.16);color:var(--good)}
.tag.bad{background:rgba(248,113,113,.16);color:var(--bad)}
.tag.warn{background:rgba(251,191,36,.16);color:var(--warn)}
.tag.info{background:rgba(96,165,250,.16);color:var(--info)}
.tag.mut{background:rgba(139,152,173,.16);color:var(--mut)}
.tag.gold{background:rgba(245,185,66,.16);color:var(--accent)}
.tag.gem{background:rgba(232,121,249,.16);color:var(--gem)}

/* ---------- Forms ---------- */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld-lbl{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.inp,select.inp,textarea.inp{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--txt);transition:border .15s;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:70px;font-family:inherit}
select.inp{cursor:pointer}
.inp-wrap{position:relative}
.inp-hint{font-size:10.5px;color:var(--mut2);margin-top:3px}
.chk{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:9px;background:var(--bg2);border:1px solid var(--line)}
.chk:hover{border-color:var(--accent)}
.chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* ---------- Search ---------- */
.search{position:relative;flex:1;min-width:0}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search .inp{padding-left:34px}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:9px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .3s ease;max-width:90vw}
.toast.ok{border-color:rgba(52,211,153,.4)}.toast.ok .ic{color:var(--good)}
.toast.err{border-color:rgba(248,113,113,.4)}.toast.err .ic{color:var(--bad)}
.toast.warn{border-color:rgba(251,191,36,.4)}.toast.warn .ic{color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:250;background:rgba(4,7,13,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{width:100%;max-width:540px;max-height:88vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modal-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-h .ic{color:var(--accent)}
.modal-title{font-size:16px;font-weight:800;flex:1}
.modal-close{background:none;border:none;color:var(--mut);cursor:pointer;padding:6px;border-radius:8px}
.modal-close:hover{background:var(--card2);color:var(--txt)}

/* ---------- Misc ---------- */
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--card2);flex:none}
.avatar.lg{width:56px;height:56px}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.empty .ic{width:42px;height:42px;color:var(--mut2);margin:0 auto 12px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(35,52,79,.4);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--mut)}.kv .v{font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.divider{height:1px;background:var(--line);margin:14px 0;border:none}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:none;padding:6px 12px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--accent)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.scroll-x{overflow-x:auto}
.row-actions{display:flex;gap:5px;flex-wrap:wrap}
.canvas-card{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mini-chart{width:100%;height:120px}

/* mobile sidebar */
#sideBack{display:none;position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5)}
@media(max-width:860px){
  :root{--side-w:260px}
  #side{position:fixed;left:0;top:0;bottom:0;z-index:95;transform:translateX(-100%);transition:transform .25s}
  #side.open{transform:translateX(0)}
  #tbMenu{display:inline-flex}
  #sideBack.show{display:block}
  #content{padding:14px}
  #topbar{padding:0 12px}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="login-logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></div>
    <div class="login-title">DEEPSHAFT CONTROL</div>
    <div class="login-sub">Admin Panel</div>
    <div class="fld">
      <div class="fld-lbl">Admin Password</div>
      <input type="password" id="loginPass" class="inp" placeholder="Enter admin password" autocomplete="current-password">
    </div>
    <button class="btn block" id="loginBtn">Unlock Panel</button>
    <div class="mut xs mt10 center" style="text-align:center">Default password: <b style="color:var(--accent)">deepshaft2026</b></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <!-- Sidebar -->
  <aside id="side">
    <div id="sideHead">
      <div class="side-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></div>
      <div><div class="side-title">DEEPSHAFT</div><div class="side-sub">Control Panel</div></div>
    </div>
    <nav id="sideNav"></nav>
    <div id="sideFoot">
      <div class="fbdot" id="fbDot"></div>
      <div class="grow"><div style="font-weight:700;font-size:11px" id="fbStatus">Connecting...</div><div class="mut2 xs">Firebase RTDB</div></div>
      <button class="btn ghost xs" id="logoutBtn">Logout</button>
    </div>
  </aside>
  <div id="sideBack"></div>

  <!-- Main -->
  <div id="main">
    <div id="topbar">
      <button id="tbMenu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <div class="row gap4">
        <div id="tbTitle">Dashboard</div>
        <div id="tbSub" class="hide"></div>
      </div>
      <div id="tbRight">
        <div class="pill" id="onlinePill"><span class="live-dot"></span><span id="onlineCnt">0 online</span></div>
        <button class="btn ghost sm" id="refreshBtn"><svg class="ic14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>Refresh</button>
        <button class="btn ghost sm" id="autoBtn"><svg class="ic14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Auto: Off</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modal" class="hide"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   CONTROL PANEL - DeepShaft Admin
   Same Firebase project as index.html. Reads users / devices / banned /
   online / payments / withdrawals / events / referrals in real time and
   pushes config + commands through localStorage (cp_config, cp_inbox,
   cp_payments, cp_withdrawals, cp_events) + BroadcastChannel('cp_channel').
   ===================================================================== */
'use strict';
</script>
<script type="module">
/* ============ FIREBASE INIT ============ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue, child, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2Ku-RIMgs37TLFO_aU6K88EQmUXpRrWI",
  authDomain: "deep-shaft.firebaseapp.com",
  databaseURL: "https://deep-shaft-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "deep-shaft",
  storageBucket: "deep-shaft.firebasestorage.app",
  messagingSenderId: "172565666879",
  appId: "1:172565666879:web:8cca80ca07b2eef7846c8a",
  measurementId: "G-DTKLJY64FG"
};
const fbApp = initializeApp(firebaseConfig);
const fbDb = getDatabase(fbApp);
const FB = { db: fbDb, ref, set, get, update, remove, onValue, child, push, serverTimestamp };
window.FB = FB;
window.dispatchEvent(new Event('fb-init'));

<script>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){
  n = Number(n)||0;
  if (Math.abs(n) < 1000) return (Math.round(n*10)/10).toString();
  const u=['K','M','B','T','Qa']; let i=-1;
  while(Math.abs(n)>=1000 && i<u.length-1){ n/=1000; i++; }
  return (Math.abs(n)>=100?Math.round(n):Math.round(n*100)/100)+u[i];
}
function fmtTon(n){ return (Math.round((Number(n)||0)*1000)/1000).toString(); }
function shortId(id){ id=String(id||''); return id.length>16?id.slice(0,10)+'…'+id.slice(-4):id; }
function shortAddr(a){ a=a||''; return a.length>14?a.slice(0,6)+'...'+a.slice(-4):a; }
function timeAgo(ts){
  if(!ts) return 'never';
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60) return Math.floor(s)+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function fmtDate(ts){
  if(!ts) return '-';
  const d=new Date(ts);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
function todayStart(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function monthStart(){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d.getTime(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function deepMerge(base, over){
  if(over===undefined||over===null) return base;
  if(Array.isArray(over)) return JSON.parse(JSON.stringify(over));
  if(typeof over==='object'&&typeof base==='object'&&base!==null&&!Array.isArray(base)){
    const out={...base};
    for(const k in over) out[k]=deepMerge(base[k],over[k]);
    return out;
  }
  return over;
}
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  raw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
};

/* Fetch ALL users (profile + state + meta) in one read of /users */
async function fetchAllUsers(){
  const snap = await window.FB.get(fbRef('users'));
  if(!snap.exists()) return [];
  const raw = snap.val() || {};
  const now = Date.now();
  return Object.entries(raw).map(([fbId, d])=>{
    const tgId = parseInt(String(fbId).replace('tg_','')) || 0;
    const prof = d.profile || {};
    const st = d.state || {};
    const online = d.online || {};
    const lastSeen = online.lastSeen || d.lastSeen || 0;
    return {
      fbId, tgId,
      name: prof.name || st.name || 'Miner',
      username: prof.username || st.username || '',
      photo: prof.photo || st.photo || '',
      ore: prof.ore || st.ore || 0,
      gems: prof.gems || st.gems || 0,
      xp: st.xp || 0,
      level: prof.level || st.level || 1,
      banned: d.banned === true,
      unbanned: d.unbanned === true,
      multiAccount: d.multiAccount || null,
      deviceId: d.deviceId || (st.friends&&st.friends.deviceId) || '',
      lastSeen,
      online: online.online===true && (now-lastSeen) < 90000,
      invitedCount: d.invitedCount || (st.friends&&st.friends.invited) || 0,
      referredBy: d.referredBy || (st.friends&&st.friends.referredBy) || '',
      joinedAt: st.joinedAt || st.ts || (d.firstSeen) || lastSeen || now,
      raw: d
    };
  }).sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
}

/* ---------- BAN / UNBAN (real-time) ---------- */
/* Ban: sets banned=true, removes unbanned flag, logs to bannedUsers/{id}. */
async function banUser(fbId, reason, durationMs){
  const data = {
    banned: true,
    bannedAt: Date.now(),
    bannedReason: reason || 'admin_ban',
    bannedBy: 'admin',
    bannedUntil: durationMs ? (Date.now()+durationMs) : 0
  };
  await fbSet('users/'+fbId+'/banned', true);
  await fbUpdate('users/'+fbId, { bannedReason: reason||'admin_ban', bannedAt: Date.now(), bannedUntil: durationMs?(Date.now()+durationMs):0 });
  await fbRemove('users/'+fbId+'/unbanned');
  await fbSet('bannedUsers/'+fbId, {
    reason: reason||'admin_ban',
    ts: Date.now(),
    bannedBy: 'admin',
    duration: durationMs||0,
    bannedUntil: durationMs?(Date.now()+durationMs):0
  });
  logEvent('ban', { fbId, reason });
  // Same-origin instant push for users currently on the banned page
  const tgId = parseInt(String(fbId).replace('tg_',''))||0;
  if(tgId){ LS.set('cp_force_ban_'+tgId, Date.now()); }
  pushBroadcast('ban');
  toast('User banned - app locked in real-time','ok','ban');
}
/* Unban: clears banned, sets unbanned=true (persistent), removes bannedUsers entry.
   Both the Firebase onValue listener in index.html AND the localStorage
   cp_force_unban_{tgId} channel deliver the unban instantly. */
async function unbanUser(fbId){
  await fbSet('users/'+fbId+'/banned', false);
  await fbSet('users/'+fbId+'/unbanned', true);
  await fbSet('users/'+fbId+'/unbannedAt', Date.now());
  await fbRemove('bannedUsers/'+fbId);
  const tgId = parseInt(String(fbId).replace('tg_',''))||0;
  if(tgId){
    // Same-origin instant channel - index.html polls this every 1.2s
    LS.set('cp_force_unban_'+tgId, Date.now());
  }
  logEvent('unban', { fbId });
  pushBroadcast('unban');
  toast('User unbanned - access restored instantly','ok','unban');
}

}
/* Queue a command into cp_inbox - consumed by every app instance on boot + on storage event */
function queueInbox(cmd){
  const inbox = LS.get('cp_inbox', []);
  inbox.push(Object.assign({ id: uid(), ts: Date.now() }, cmd));
  LS.set('cp_inbox', inbox);
  try{ window.dispatchEvent(new Event('storage')); }catch(e){}
  pushBroadcast('inbox');
}

let ONLINE_COUNT=0, ONLINE_USERS=[];
function startOnlineListener(){
  // /onlineUsers is maintained by index.html heartbeat; fall back to scanning users/{id}/online
  fbOn('onlineUsers', (v)=>{
    if(v && typeof v==='object'){
      ONLINE_USERS = Object.entries(v).map(([fbId,d])=>({fbId, ...(d||{})}));
      ONLINE_COUNT = ONLINE_USERS.length;
      updateOnlinePill();
    }
  });
  // Periodic refresh as fallback
  refreshOnlineCount();
  setInterval(refreshOnlineCount, 20000);
}
async function refreshOnlineCount(){
  try{
    const users = await fetchAllUsers();
    const now=Date.now();
    ONLINE_USERS = users.filter(u=>u.online).map(u=>({fbId:u.fbId, name:u.name, tgId:u.tgId, lastSeen:u.lastSeen, photo:u.photo, deviceId:u.deviceId}));
    ONLINE_COUNT = ONLINE_USERS.length;
    updateOnlinePill();
  }catch(e){}
}
function updateOnlinePill(){
  const el=$('#onlineCnt'); if(el) el.textContent = ONLINE_COUNT+' online';
}

function drawGrowthChart(users){
  setTimeout(()=>{
    const cv=document.getElementById('growthChart'); if(!cv) return;
    const days=[], cnt=[];
    for(let i=13;i>=0;i--){ const d=todayStart()-i*86400000; days.push(d); cnt.push(users.filter(u=>u.joinedAt>=d && u.joinedAt<d+86400000).length); }
    const max=Math.max(1,...cnt);
    const ctx=cv.getContext('2d');
    const W=cv.width=cv.offsetWidth, H=cv.offsetHeight=cv.offsetHeight||160;
    ctx.clearRect(0,0,W,H);
    // grid
    ctx.strokeStyle='#23344f'; ctx.lineWidth=1;
    for(let i=0;i<4;i++){ const y=10+i*((H-20)/3); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    // bars
    const bw=W/days.length;
    cnt.forEach((v,i)=>{
      const bh=(v/max)*(H-30);
      const x=i*bw+3, y=H-bh-12;
      const grad=ctx.createLinearGradient(0,y,0,H);
      grad.addColorStop(0,'#f5b942'); grad.addColorStop(1,'rgba(245,185,66,.3)');
      ctx.fillStyle=grad; ctx.fillRect(x,y,bw-6,bh);
      ctx.fillStyle='#8b98ad'; ctx.font='9px Manrope'; ctx.textAlign='center';
      const lbl=new Date(days[i]).getDate()+'/'+(new Date(days[i]).getMonth()+1);
      ctx.fillText(lbl, x+(bw-6)/2, H-2);
      if(v>0){ ctx.fillStyle='#eaf0fb'; ctx.fillText(v, x+(bw-6)/2, y-3); }
    });
  }, 60);
}

function renderUsersTable(){
  let users = (LAST_DATA.users||[]).slice();
  const q=USERS_SEARCH.trim().toLowerCase();
  if(q) users=users.filter(u=>(u.name||'').toLowerCase().includes(q)||(u.username||'').toLowerCase().includes(q)||String(u.tgId).includes(q));
  const pays=new Set((LS.get('cp_payments',[])).map(p=>p.userId));
  if(USERS_FILTER==='online') users=users.filter(u=>u.online);
  else if(USERS_FILTER==='banned') users=users.filter(u=>u.banned);
  else if(USERS_FILTER==='vip') users=users.filter(u=>u.ore>=1000000);
  else if(USERS_FILTER==='purchaser') users=users.filter(u=>pays.has(u.tgId));
  else if(USERS_FILTER==='multi') users=users.filter(u=>u.multiAccount);
  const sf={lastSeen:'lastSeen',ore:'ore',level:'level',joined:'joinedAt',name:'name'}[USERS_SORT]||'lastSeen';
  users.sort(function(a,b){
    if(USERS_SORT==='name') return (a.name||'').localeCompare(b.name||'');
    return (Number(b[sf]||0))-(Number(a[sf]||0));
  });
  const el=$('#usersTable'); if(!el) return;
  if(!users.length){ el.innerHTML='<div class="empty">'+I('users')+'<div>No users match.</div></div>'; return; }
  el.innerHTML='<div class="mut sm mb10">Showing '+users.length+' of '+(LAST_DATA.users||[]).length+' users</div>'+
    '<div class="tbl-wrap scroll-x"><table class="tbl"><thead><tr><th><input type="checkbox" id="selAll"></th><th>User</th><th>TG ID</th><th>ORE</th><th>GEM</th><th>Lvl</th><th>Status</th><th>Last Seen</th><th>Actions</th></tr></thead><tbody>'+
    users.slice(0,200).map(u=>{
      const st = u.banned?'<span class="tag bad">Banned</span>':(u.online?'<span class="tag good">Online</span>':'<span class="tag mut">Offline</span>');
      return '<tr><td><input type="checkbox" class="usel" data-id="'+esc(u.fbId)+'"></td><td><div class="row gap6">'+(u.photo?'<img class="avatar" src="'+esc(u.photo)+'">':ic('user'))+'<div><div style="font-weight:700">'+esc(u.name)+'</div><div class="mut2 xs">@'+esc(u.username||'-')+'</div></div></div></td><td class="num">'+(u.tgId||'-')+'</td><td class="num">'+fmt(u.ore)+'</td><td class="num">'+fmt(u.gems)+'</td><td class="num">'+(u.level||1)+'</td><td>'+st+'</td><td class="mut sm">'+timeAgo(u.lastSeen)+'</td><td><div class="row-actions"><button class="btn ghost xs" onclick="userDetail(\''+esc(u.fbId)+'\')">'+I('eye')+'View</button>'+(u.banned?'<button class="btn green xs" onclick="doUnban(\''+esc(u.fbId)+'\')">'+I('unban')+'Unban</button>':'<button class="btn red xs" onclick="doBan(\''+esc(u.fbId)+'\')">'+I('ban')+'Ban</button>')+'</div></td></tr>';
    }).join('')+
    '</tbody></table></div>'+
    (users.length>200?'<div class="mut sm mt10">First 200 shown. Refine search to narrow.</div>':'')+
    '<div class="stitle">'+ic('layers')+'Bulk Actions (selected)</div>'+
    '<div class="row wrap gap10"><button class="btn red sm" onclick="bulkBan()">'+I('ban')+'Ban Selected</button><button class="btn green sm" onclick="bulkUnban()">'+I('unban')+'Unban Selected</button><button class="btn cyan sm" onclick="bulkGrant()">'+I('gift')+'Grant Balance</button><button class="btn purple sm" onclick="bulkNotify()">'+I('bell')+'Notify Selected</button><button class="btn ghost sm" onclick="bulkExport()">'+I('export')+'Export Selected</button></div>';
  const sa=$('#selAll'); if(sa) sa.onchange=e=>$$('.usel').forEach(c=>c.checked=e.target.checked);
}

function fieldRow(label, path, val, type){
  const id='fld_'+path.replace(/\./g,'_');
  let inp='';
  if(type==='toggle') inp='<label class="chk" style="margin:0;padding:4px 8px"><input type="checkbox" id="'+id+'" '+(val?'checked':'')+' onchange="setCfg(\''+path+'\','+(val?'false':'true')+')"> <span class="sm">'+(val?'On':'Off')+'</span></label>';
  else if(type==='num') inp='<input type="number" class="inp sm" id="'+id+'" value="'+esc(val)+'" style="width:120px" onchange="setCfg(\''+path+'\', Number(this.value))">';
  else inp='<input class="inp sm" id="'+id+'" value="'+esc(val)+'" style="width:220px" onchange="setCfg(\''+path+'\', this.value)">';
  return '<div class="kv"><span class="k">'+esc(label)+'</span><span>'+inp+'</span></div>';
}
window.setCfg=(path,val)=>{ const parts=path.split('.'); let o=CFG; for(let i=0;i<parts.length-1;i++){ if(!o[parts[i]]) o[parts[i]]={}; o=o[parts[i]]; } o[parts[parts.length-1]]=val; };

  const f=input.files[0]; if(!f) return;
  if(f.size>2*1024*1024){ toast('Image too large (max 2MB)','warn'); return; }
  const r=new FileReader();
  r.onload=()=>{ $('#tPhoto').value=r.result; const p=$('#tPhotoPrev'); if(p) p.outerHTML='<img id="tPhotoPrev" src="'+r.result+'" style="width:40px;height:40px;border-radius:8px;object-fit:cover">'; };
  r.readAsDataURL(f);
};

  const t={
    id: id||uid(),
    title: $('#tTitle').value, desc: $('#tDesc').value, link: $('#tLink').value,
    type: $('#tType').value, photo: $('#tPhoto').value,
    rewardOre: Number($('#tROre').value)||0, rewardGem: Number($('#tRGem').value)||0, rewardXp: Number($('#tRXp').value)||0,

    targetLevel: Number($('#tLvl').value)||0, expiry: $('#tExp').value? (Date.now()+(Number($('#tExp').value)*86400000)) : 0, targetCountry: $('#tCountry').value,
    enabled: $('#tEnabled').checked
  };
  const tasks=CFG.tasks||[]; const i=tasks.findIndex(x=>x.id===t.id);
  if(i>=0){ tasks[i]=Object.assign({},tasks[i],t); } else { tasks.push(Object.assign({completions:0,createdAt:Date.now()},t)); }

window.chanLogoUp=(input)=>{ const f=input.files[0]; if(!f||f.size>2*1024*1024) return toast('Too large','warn'); const r=new FileReader(); r.onload=()=>{ $('#cLogo').value=r.result; }; r.readAsDataURL(f); };
window.chanSave=(id)=>{
  const ch={id:id||uid(), name:$('#cName').value, username:$('#cUser').value.replace(/^@/,''), url:$('#cUrl').value, logo:$('#cLogo').value};

window.chanDel=(id)=>{ confirmBox('Delete Channel','Remove this mandatory channel?', ()=>{ CFG.mandatoryTasks.channels=(CFG.mandatoryTasks.channels||[]).filter(x=>x.id!==id); saveConfig(); render('mandatory'); }, 'trash'); };

window.renderCur=()=>{ render(CURRENT_VIEW); };
window.listExport=(key)=>{ downloadFile(key+'.json', JSON.stringify(CFG[key]||[],null,2),'application/json'); };
window.listDel=(key,id)=>{ confirmBox('Delete','Remove this item?', ()=>{ CFG[key]=(CFG[key]||[]).filter(x=>x.id!==id); saveConfig(); render(CURRENT_VIEW); }, 'trash'); };
window.listAdd=async (key,title,fields)=>{ const obj={id:uid()}; fields.forEach(f=>obj[f]= f==='enabled'?true: f==='mult'||f==='hpMult'||f==='power'||f==='bonus'?1 : 0); CFG[key]=(CFG[key]||[]).concat([obj]); saveConfig(); };
window.listEdit=async (key,title,fields,id)=>{
  const item=(CFG[key]||[]).find(x=>x.id===id); if(!item) return;
  let html='<div class="card">';
  fields.forEach(f=>{
    const v=item[f]; const num=['mult','hpMult','reqLevel','costOre','costGem','costTon','power','bonus','bonusPercent','gems','priceTon'].includes(f);
    if(f==='enabled') html+='<label class="chk mt6"><input type="checkbox" id="lf_'+f+'" '+(v!==false?'checked':'')+'> '+esc(f)+'</label>';
    else html+='<div class="fld"><div class="fld-lbl">'+esc(f)+'</div><input class="inp" id="lf_'+f+'" type="'+(num?'number':'text')+'" value="'+esc(v??'')+'"></div>';
  });
  html+='<button class="btn block" onclick="listSave(\''+key+'\','+JSON.stringify(id).replace(/"/g,'&quot;')+','+JSON.stringify(fields).replace(/"/g,'&quot;')+').then(()=>{closeModal();render(\''+CURRENT_VIEW+'\')})">Save</button></div>';
  openModal('Edit '+title, html, 'edit');
};
window.listSave=async (key,id,fields)=>{
  const item=(CFG[key]||[]).find(x=>x.id===id); if(!item) return;
  fields.forEach(f=>{
    const el=$('#lf_'+f); if(!el) return;
    item[f]= f==='enabled'?el.checked : (['mult','hpMult','reqLevel','costOre','costGem','costTon','power','bonus','bonusPercent','gems','priceTon'].includes(f)?Number(el.value)||0:el.value);
  });
  saveConfig();
};

registerRenderer('broadcast',(c)=>{
  c.innerHTML='<div class="stitle">'+ic('megaphone')+'Broadcast</div>'+

      '<div class="fld"><div class="fld-lbl">Message (max 1000 chars)</div><textarea class="inp" id="bcMsg" maxlength="1000" placeholder="Your message to all users..."></textarea><div class="inp-hint" id="bcCnt">0/1000</div></div>'+
      '<div class="grid g3"><div class="fld"><div class="fld-lbl">Action button text (optional)</div><input class="inp" id="bcBtn" placeholder="Open"></div><div class="fld"><div class="fld-lbl">Action URL</div><input class="inp" id="bcUrl" placeholder="https://..."></div><div class="fld"><div class="fld-lbl">Image URL</div><input class="inp" id="bcImg"></div></div>'+
      '<div class="fld"><div class="fld-lbl">Target audience</div><select class="inp" id="bcTarget"><option value="all">All users</option><option value="online">Online only</option><option value="vip">VIP (1M+ ORE)</option><option value="banned">Banned users</option><option value="active">Active (last 7 days)</option></select></div>'+
      '<label class="chk mt6"><input type="checkbox" id="bcPush"> Also queue as inbox command (real-time toast in app)</label>'+
      '<div class="row gap10 mt10"><button class="btn block" onclick="broadcastSend()">'+I('send')+'Send Broadcast</button><button class="btn ghost" onclick="broadcastPreview()">'+I('eye')+'Preview</button></div>'+
    '</div>'+
    '<div class="card"><div class="card-h">'+ic('history')+'<div class="card-title">Broadcast History</div></div><div id="bcHist"></div></div>';
  $('#bcMsg').oninput=e=>$('#bcCnt').textContent=e.target.value.length+'/1000';
  const evs=getEvents().filter(e=>e.type==='broadcast');
  $('#bcHist').innerHTML=evs.length?evs.slice(0,20).map(e=>'<div class="kv"><span class="k sm">'+fmtDate(e.ts)+'</span><span class="v sm">'+esc((e.data&&e.data.title)||'')+'</span></div>').join(''):'<div class="empty sm">No broadcasts sent yet</div>';
});
window.broadcastPreview=()=>{ const t=$('#bcTitle').value,m=$('#bcMsg').value; openModal('Preview','<div class="card"><div style="font-weight:800;font-size:16px;margin-bottom:6px">'+esc(t||'Title')+'</div><div style="font-size:13px;line-height:1.5">'+esc(m||'(message)')+'</div></div>','eye'); };
window.broadcastSend=async ()=>{
  const title=$('#bcTitle').value, msg=$('#bcMsg').value;
  if(!title||!msg) return toast('Title and message required','err');
  const target=$('#bcTarget').value, btn=$('#bcBtn').value, url=$('#bcUrl').value, img=$('#bcImg').value, push=$('#bcPush').checked;
  // Queue notification command for every matching user
  const users=LAST_DATA.users||[];
  const now=Date.now();
  let targets=users;
  if(target==='online') targets=users.filter(u=>u.online);
  else if(target==='vip') targets=users.filter(u=>u.ore>=1000000);
  else if(target==='banned') targets=users.filter(u=>u.banned);
  else if(target==='active') targets=users.filter(u=>(now-u.lastSeen)<7*86400000);
  if(push){ targets.forEach(u=>queueInbox({cmd:'notify',fbId:u.fbId,userId:u.tgId,title:title,msg:msg,btn,url,img})); }
  // Store broadcast announcement
  CFG.panel=CFG.panel||{}; CFG.panel.announcement=title+': '+msg; CFG.panel.announcementActive=true; CFG.panel.announcementUrl=url;
  saveConfig();
  logEvent('broadcast',{title,msg,target:target,count:targets.length,btn,url});
  toast('Broadcast sent to '+targets.length+' users','ok','megaphone'); render('broadcast');
};

window.directNotify=()=>{ const tg=Number($('#dnTg').value)||0; if(!tg) return toast('Telegram ID required','err'); queueInbox({cmd:'notify',userId:tg,title:$('#dnT').value,msg:$('#dnM').value}); toast('Notification queued','ok','bell'); };
window.botPush=async ()=>{
  const tok=$('#botTok').value.trim(), chat=$('#botChat').value.trim(), msg=$('#botMsg').value;
  if(!tok||!chat||!msg) return toast('All fields required','err');
  try{
    const r=await fetch('https://api.telegram.org/bot'+tok+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chat,text:msg})});
    const j=await r.json();
    if(j.ok) toast('Telegram message sent','ok','telegram'); else toast('Telegram error: '+(j.description||''),'err');
  }catch(e){ toast('Send failed: '+e.message,'err'); }
};

/* TON Connect UI loader - lazy load the SDK */
let TON_UI=null;
function setupTonConnect(){
  const area=$('#tonWalletArea'); if(!area) return;
  const connected = window.TON_WALLET && window.TON_WALLET.connected;
  if(connected){
    const w=window.TON_WALLET;
    area.innerHTML='<div class="row gap10"><div class="avatar" style="background:var(--card2);display:flex;align-items:center;justify-content:center">'+I('ton')+'</div><div class="grow"><div style="font-weight:800">'+esc(w.name||'Wallet')+'</div><div class="mut sm num">'+shortAddr(w.account&&w.account.address)+'</div></div><button class="btn ghost sm" onclick="tonDisconnect()">'+I('logout')+'Disconnect</button></div>';
  } else {
    area.innerHTML='<div class="row gap10"><button class="btn cyan block" onclick="tonConnect()">'+I('wallet')+'Connect Treasury Wallet</button></div><div class="mut xs mt6">Connect the project treasury wallet. Auto-payouts are signed and broadcast through it via TON Connect SDK.</div>';
  }
}
window.tonConnect=async ()=>{
  if(!window.TonConnectUI){
    await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@tonconnect/ui@2/dist/tonconnect-ui.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  }
  try{
    TON_UI=new window.TonConnectUI({ manifestUrl: (CFG.payments&&CFG.payments.tonconnect&&CFG.payments.tonconnect.manifestUrl) || (location.origin+'/tonconnect-manifest.json') });
    const w=await TON_UI.connectWallet();
    if(w){
      window.TON_WALLET={ connected:true, connector:TON_UI.connector, account:w.account, name:(w.device&&w.device.appName)||'Wallet' };
      toast('Treasury wallet connected','ok','wallet');
      setupTonConnect();
    }
  }catch(e){ toast('TON Connect failed: '+e.message,'err'); }
};
window.tonDisconnect=async ()=>{ try{ if(TON_UI) await TON_UI.disconnect(); }catch(e){} window.TON_WALLET=null; setupTonConnect(); toast('Wallet disconnected','warn'); };
window.autoPayAll=()=>{ confirmBox('Auto-Pay All','Send TON to ALL pending withdrawals from the treasury wallet?', async()=>{ const wds=LS.get('cp_withdrawals',[]).filter(w=>w.status==='pending'); if(!wds.length) return toast('Nothing pending','warn'); if(!window.TON_WALLET||!window.TON_WALLET.connected) return toast('Connect wallet first','warn'); let ok=0; for(const w of wds){ try{ const tx={validUntil:Math.floor(Date.now()/1000)+300, messages:[{address:w.address, amount:String(Math.round((w.amountTon||0)*1e9))}]}; await window.TON_WALLET.connector.sendTransaction(tx); const all=LS.get('cp_withdrawals',[]); const ww=all.find(x=>x.id===w.id); if(ww){ ww.status='paid'; ww.paidAt=Date.now(); LS.set('cp_withdrawals',all); } ok++; }catch(e){ toast('Failed: '+w.userName,'err'); } } toast(ok+' payouts sent','ok','zap'); render('autoWithdraw'); }, 'zap'); };

registerRenderer('revenue',(c)=>{
  const pays=LS.get('cp_payments',[]).filter(p=>p.status==='paid');
  const wds=LS.get('cp_withdrawals',[]).filter(w=>w.status==='paid');
  const totDep=pays.reduce((s,p)=>s+(Number(p.amountTon)||0),0);
  const totWd=wds.reduce((s,w)=>s+(Number(w.amountTon)||0),0);
  const net=totDep-totWd;
  const byDay={};
  pays.forEach(p=>{ const d=new Date(p.ts); const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); byDay[k]=(byDay[k]||0)+(Number(p.amountTon)||0); });
  c.innerHTML='<div class="stitle">'+ic('coin')+'Revenue</div>'+
    '<div class="grid g4 mb10"><div class="stat"><div class="stat-ico green">'+ic('deposit')+'</div><div class="stat-lbl">Deposits</div><div class="stat-val num">'+fmtTon(totDep)+'</div><div class="stat-sub">TON received</div></div>'+
    '<div class="stat"><div class="stat-ico red">'+ic('withdraw')+'</div><div class="stat-lbl">Withdrawals</div><div class="stat-val num">'+fmtTon(totWd)+'</div><div class="stat-sub">TON paid out</div></div>'+
    '<div class="stat"><div class="stat-ico gold">'+ic('trend')+'</div><div class="stat-lbl">Net Revenue</div><div class="stat-val num">'+fmtTon(net)+'</div><div class="stat-sub">retained</div></div>'+
    '<div class="stat"><div class="stat-ico cyan">'+ic('users')+'</div><div class="stat-lbl">Paying Users</div><div class="stat-val num">'+new Set(pays.map(p=>p.userId)).size+'</div></div></div>'+
    '<div class="card"><div class="card-h">'+ic('chart')+'<div class="card-title">Daily Deposits (last 14 days)</div></div><canvas id="revChart" class="mini-chart" style="height:200px"></canvas></div>'+
    '<div class="row mt10 gap10"><button class="btn ghost sm" onclick="revExport()">'+I('export')+'Export Revenue CSV</button></div>';
  setTimeout(()=>{ const cv=$('#revChart'); if(!cv) return; const ctx=cv.getContext('2d'); const W=cv.width=cv.offsetWidth,H=cv.height=cv.offsetHeight||200; ctx.clearRect(0,0,W,H); const days=[]; for(let i=13;i>=0;i--){ const d=new Date(todayStart()-i*86400000); const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); days.push({k,v:byDay[k]||0,d}); } const max=Math.max(0.1,...days.map(x=>x.v)); const bw=W/days.length; days.forEach((x,i)=>{ const bh=(x.v/max)*(H-30); const grad=ctx.createLinearGradient(0,H-bh-12,0,H); grad.addColorStop(0,'#34d399'); grad.addColorStop(1,'rgba(52,211,153,.2)'); ctx.fillStyle=grad; ctx.fillRect(i*bw+4,H-bh-12,bw-8,bh); ctx.fillStyle='#8b98ad'; ctx.font='9px Manrope'; ctx.textAlign='center'; ctx.fillText(x.d.getDate()+'/'+(x.d.getMonth()+1), i*bw+bw/2, H-2); if(x.v>0){ ctx.fillStyle='#eaf0fb'; ctx.fillText(fmtTon(x.v), i*bw+bw/2, H-bh-16); } }); }, 60);
});

  let filt=evs;
  const upd=()=>{ $('#logList').innerHTML = filt.length?'<div class="tbl-wrap scroll-x"><table class="tbl"><thead><tr><th>Time</th><th>Type</th><th>Details</th></tr></thead><tbody>'+filt.slice(0,300).map(e=>'<tr><td class="sm">'+fmtDate(e.ts)+'</td><td><span class="tag info">'+esc(e.type)+'</span></td><td class="sm">'+esc(JSON.stringify(e.data||{}).slice(0,100))+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">'+I('history')+'<div>No logs</div></div>'; };
  $('#logSearch').oninput=e=>{ const q=e.target.value.toLowerCase(); filt=evs.filter(x=>(x.type||'').toLowerCase().includes(q)||JSON.stringify(x.data||{}).toLowerCase().includes(q)); upd(); };
  $('#logType').onchange=e=>{ filt=e.target.value?evs.filter(x=>x.type===e.target.value):evs; upd(); };
  upd();
});
window.logClear=()=>{ confirmBox('Clear Logs','Delete ALL logged events?', ()=>{ LS.del('cp_events'); toast('Logs cleared','ok','trash'); render('logs'); }, 'trash'); };
window.logExport=()=>{ downloadFile('logs.json', JSON.stringify(getEvents(),null,2),'application/json'); };

window.backupAll=()=>{ const data={ config:CFG, events:getEvents(), payments:LS.get('cp_payments',[]), withdrawals:LS.get('cp_withdrawals',[]), ts:Date.now() }; downloadFile('deepshaft_backup_'+Date.now()+'.json', JSON.stringify(data,null,2),'application/json'); toast('Backup downloaded','ok','download'); };
window.backupConfig=()=>{ downloadFile('cp_config_'+Date.now()+'.json', JSON.stringify(CFG,null,2),'application/json'); };
window.restoreDo=()=>{ const f=$('#restoreFile').files[0]; if(!f) return toast('Select a file','err'); const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.config){ CFG=deepMerge(CFG,d.config); saveConfig(); } if(d.events) LS.set('cp_events',d.events); if(d.payments) LS.set('cp_payments',d.payments); if(d.withdrawals) LS.set('cp_withdrawals',d.withdrawals); toast('Restore complete','ok','upload'); render('backup'); }catch(e){ toast('Invalid backup file','err'); } }; r.readAsText(f); };
window.wipeAll=()=>{ confirmBox('Wipe All Data','Delete ALL localStorage panel data? This cannot be undone.', ()=>{ ['cp_config','cp_state','cp_payments','cp_withdrawals','cp_events'].forEach(k=>LS.del(k)); toast('Panel data wiped','warn','trash'); CFG=null; loadConfig(); render('backup'); }, 'trash'); };

  c.innerHTML='<div class="stitle">'+ic('key')+'Admin Account</div>'+
    '<div class="card mb10"><div class="card-h">'+ic('lock')+'<div class="card-title">Change Password</div></div>'+

      getEvents().filter(e=>['ban','unban','grant','reset','broadcast'].includes(e.type)).slice(0,20).map(e=>'<div class="kv"><span class="k sm">'+fmtDate(e.ts)+'</span><span class="v sm">'+esc(e.type)+'</span></div>').join('')||'<div class="empty sm">No admin actions logged</div>'+

window.changePass=()=>{ const cur=$('#pwCur').value, nw=$('#pwNew').value, conf=$('#pwConf').value; if(cur!==LS.get(ADMIN_PASS_KEY,'deepshaft2026')) return toast('Current password wrong','err'); if(nw.length<6) return toast('New password too short (min 6)','warn'); if(nw!==conf) return toast('Passwords do not match','err'); LS.set(ADMIN_PASS_KEY, nw); toast('Password updated','ok','check'); };
/* =====================================================================
   HELPERS
   ===================================================================== */
function downloadFile(name, content, mime){
  const blob=new Blob([content],{type:mime||'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
window.downloadFile=downloadFile;

/* =====================================================================
   INIT + EVENT WIRING
   ===================================================================== */
function boot(){
  loadConfig().then(()=>{
    buildNav();
    // Login gate
    if(checkSession()){ showApp(); }
    else { $('#login').classList.remove('hide'); $('#app').classList.add('hide'); }
    // Login button
    $('#loginBtn').onclick=()=>{
      const p=$('#loginPass').value;
      if(login(p)){ $('#login').classList.add('hide'); showApp(); toast('Welcome back, admin','ok','shield'); }
      else toast('Wrong password','err','ban');
    };
    $('#loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#loginBtn').click(); });
    // Logout
    $('#logoutBtn').onclick=logout;
    // Refresh
    $('#refreshBtn').onclick=()=>{ toast('Refreshing data...','ok','refresh'); go(CURRENT_VIEW); };
    // Auto refresh
    $('#autoBtn').onclick=toggleAuto;
    // Mobile sidebar
    $('#tbMenu').onclick=()=>{ $('#side').classList.toggle('open'); $('#sideBack').classList.toggle('show'); };
    $('#sideBack').onclick=()=>{ $('#side').classList.remove('open'); $('#sideBack').classList.remove('show'); };
    // Click outside modal closes
    $('#modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
    // Esc closes modal
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
    // Firebase status indicator
    if(FB_READY){ $('#fbDot').classList.add('on'); $('#fbStatus').textContent='Connected'; }
  });
}
function showApp(){
  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  go('dashboard');
  // initial data preload
  fetchAllUsers().then(u=>{ LAST_DATA.users=u; refreshNavBadges(); });
  fetchBannedUsers().then(b=>{ LAST_DATA.banned=b; refreshNavBadges(); });
}
function toggleAuto(){
  AUTO_REFRESH=!AUTO_REFRESH;
  const b=$('#autoBtn');
  b.innerHTML = ic('clock')+'Auto: '+(AUTO_REFRESH?'On':'Off');
  b.classList.toggle('cyan', AUTO_REFRESH);
  b.classList.toggle('ghost', !AUTO_REFRESH);
  if(AUTO_REFRESH){
    AUTO_TIMER=setInterval(()=>{ go(CURRENT_VIEW); }, 30000);
    toast('Auto-refresh on (30s)','ok','clock');
  } else { clearInterval(AUTO_TIMER); toast('Auto-refresh off','warn'); }
}

window.go=go; window.render=render; window.saveConfig=saveConfig; window.setCfg=window.setCfg||function(){};
window.userDetail=window.userDetail||function(){};
window.toast=toast; window.openModal=openModal; window.closeModal=closeModal;

/* expose key functions for inline onclick */
window.LS=LS; window.banUser=banUser; window.unbanUser=unbanUser; window.fbSet=fbSet; window.fbUpdate=fbUpdate; window.fbRemove=fbRemove; window.fbGet=fbGet; window.queueInbox=queueInbox; window.logEvent=logEvent; window.pushBroadcast=pushBroadcast; window.fieldRow=fieldRow; window.CFG=CFG;
window.refreshOnlineCount=refreshOnlineCount;

/* boot when DOM ready */
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* expose CFG as live getter so external calls see updates */
try{ Object.defineProperty(window,'CFG',{get:()=>CFG,set:v=>{CFG=v;}}); }catch(e){}
</script>
