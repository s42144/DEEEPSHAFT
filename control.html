<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f1a">
<title>DeepShaft Control Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DEEPSHAFT CONTROL PANEL - single file admin console.
   Drives index.html (Telegram mini app) live through Firebase.
   No emoji anywhere - all icons are inline SVG.
   ============================================================ */
:root{
  --bg:#070b14; --bg2:#0b0f1a; --card:#131c2e; --card2:#182338; --line:#223047; --line2:#2c3d5a;
  --txt:#eaf0fb; --mut:#8b98ad;
  --accent:#f5b942; --accent2:#22d3ee;
  --good:#34d399; --bad:#f87171; --gem:#e879f9; --warn:#fb923c;
  --side-w:236px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--txt)}
img{-webkit-user-drag:none}
.hide{display:none!important}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.sm{font-size:12px}.xs{font-size:11px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ic{width:17px;height:17px;flex:none}
.ic-lg{width:20px;height:20px}
.ic-sm{width:14px;height:14px}
.c-acc{color:var(--accent)}.c-cy{color:var(--accent2)}.c-gd{color:var(--good)}.c-bd{color:var(--bad)}.c-gm{color:var(--gem)}.c-wn{color:var(--warn)}

/* ---------- Auth gate ---------- */
#auth{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;
  background:radial-gradient(800px 500px at 50% 20%, #101a2e 0%, var(--bg) 70%);z-index:100;padding:20px;
}
.authbox{width:min(420px,94vw);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;text-align:center}
.authlogo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(140deg,#1c2a4a,#101a2e);display:flex;align-items:center;justify-content:center;color:var(--accent);border:1px solid var(--line2)}
.auth-t{font-size:20px;font-weight:800;letter-spacing:.02em}
.auth-s{font-size:12px;color:var(--mut);margin-top:4px}
.inp{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;
  font-size:14px;outline:none;transition:border .15s;
}
.inp:focus{border-color:var(--accent2)}
select.inp{appearance:none;background-image:none}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5;font-size:12.5px}
label.lb{display:block;font-size:10.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 6px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--card2);
  color:var(--txt);border:1px solid var(--line2);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;
  transition:transform .1s, filter .15s;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.15)}
.btn.pri{background:linear-gradient(140deg,#f5b942,#d99a20);border-color:#f5b942;color:#0b0f1a}
.btn.cy{background:linear-gradient(140deg,#22d3ee,#0e9dbb);border-color:#22d3ee;color:#04222b}
.btn.gd{background:linear-gradient(140deg,#34d399,#1fa875);border-color:#34d399;color:#04221a}
.btn.bd{background:linear-gradient(140deg,#f87171,#dc4b4b);border-color:#f87171;color:#2b0808}
.btn.gh{background:transparent}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.btn.xs{padding:4px 9px;font-size:11px;border-radius:9px;gap:5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- Layout ---------- */
#panel{display:flex;height:100vh;height:100dvh}
#side{
  width:var(--side-w);flex:none;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.brand .blogo{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,#1c2a4a,#101a2e);display:flex;align-items:center;justify-content:center;color:var(--accent);border:1px solid var(--line2);flex:none}
.brand b{font-size:14px;letter-spacing:.04em}
.brand .xs{display:block}
#nav{flex:1;overflow-y:auto;padding:10px}
#nav::-webkit-scrollbar{width:4px}#nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.nv{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;margin-bottom:2px;border-radius:11px;
  background:transparent;border:1px solid transparent;color:var(--mut);font-size:12.5px;font-weight:700;text-align:left;
}
.nv:hover{color:var(--txt);background:rgba(255,255,255,.03)}
.nv.on{background:rgba(245,185,66,.09);border-color:rgba(245,185,66,.3);color:var(--accent)}
.nv .bdg{margin-left:auto;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;border-radius:99px;padding:2px 7px;min-width:18px;text-align:center}
.nv .bdg.acc{background:var(--accent);color:#1a1206}
.nvh{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:#5a6b85;text-transform:uppercase;padding:10px 12px 4px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{
  height:58px;flex:none;border-bottom:1px solid var(--line);background:var(--bg2);
  display:flex;align-items:center;gap:12px;padding:0 18px;
}
#topbar .tt{font-size:16px;font-weight:800}
#walletChip{display:flex;align-items:center;gap:8px}
#content{flex:1;overflow-y:auto;padding:18px}
#content::-webkit-scrollbar{width:8px}#content::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.onlinedot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 8px rgba(52,211,153,.7);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1100px){.g5,.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi{position:relative;overflow:hidden}
.kpi .kl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .kv{font-size:22px;font-weight:800;margin-top:6px}
.kpi .ks{font-size:10.5px;color:var(--mut);margin-top:2px}
.kpi .kw{position:absolute;top:-14px;right:-10px;opacity:.1;width:76px;height:76px}
.stitle{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.stitle:first-child{margin-top:0}
.stitle .after{margin-left:auto;display:flex;gap:6px;align-items:center}

/* ---------- Tables ---------- */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;min-width:640px}
th{
  text-align:left;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
  padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card2);z-index:2;white-space:nowrap;
}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--txt)}
td{padding:9px 12px;border-bottom:1px solid rgba(34,48,71,.5);font-size:12.5px;vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--line2)}
.avph{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--card2);color:var(--mut);font-size:11px;font-weight:800;border:1px solid var(--line2)}
.wtag{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);text-transform:uppercase;letter-spacing:.05em}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.actrow{display:flex;gap:5px;flex-wrap:wrap}

/* ---------- Modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:90;display:none}
#modalRoot.open{display:flex;align-items:center;justify-content:center;padding:18px}
.mback{position:absolute;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(3px)}
.mbox{
  position:relative;width:min(880px,96vw);max-height:92vh;overflow-y:auto;background:var(--card);
  border:1px solid var(--line2);border-radius:18px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.5);
}
.mbox.sm{width:min(480px,96vw)}
.mbox.lg{width:min(1080px,97vw)}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mhead .mt{font-size:16px;font-weight:800}
.mclose{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:10px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.mclose:hover{color:var(--txt)}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.mtab{padding:7px 13px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:12px;font-weight:700}
.mtab.on{color:var(--accent);border-color:rgba(245,185,66,.4);background:rgba(245,185,66,.08)}

/* ---------- Toasts ---------- */
#toastRoot{position:fixed;bottom:18px;right:18px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(360px,90vw)}
.toast{
  background:var(--card2);border:1px solid var(--line2);border-left:3px solid var(--accent2);border-radius:12px;
  padding:11px 14px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start;animation:tin .2s ease;box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.toast.ok{border-left-color:var(--good)}
.toast.err{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ---------- Misc ---------- */
.barwrap{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.barwrap>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}
.chartbars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.chartbars .cb{flex:1;background:linear-gradient(180deg,var(--accent2),#115e70);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chartbars .cb:hover::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;white-space:nowrap;z-index:3}
.chartbars .cb.gold{background:linear-gradient(180deg,var(--accent),#7a5410)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--mut)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.fieldrow{display:grid;grid-template-columns:170px 1fr;gap:8px;align-items:center;margin-bottom:9px}
.fieldrow>label{font-size:11.5px;color:var(--mut);font-weight:700}
@media(max-width:640px){.fieldrow{grid-template-columns:1fr}}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.switch i:before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#8b98ad;top:3px;left:3px;transition:.2s}
.switch input:checked+i{background:rgba(52,211,153,.35)}
.switch input:checked+i:before{transform:translateX(18px);background:var(--good)}
.codebox{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--accent2)}
.empty{padding:34px 16px;text-align:center;color:var(--mut);font-size:13px}
.upimg{width:64px;height:64px;border-radius:12px;border:1px dashed var(--line2);object-fit:cover;background:var(--bg2)}
.upbtn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--accent2);cursor:pointer;border:1px dashed var(--line2);border-radius:9px;padding:6px 10px}
.upbtn:hover{border-color:var(--accent2)}
.searchbar{position:relative}
.searchbar .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
.searchbar .inp{padding-left:32px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.fchip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:11.5px;font-weight:700}
.fchip.on{color:var(--accent);border-color:rgba(245,185,66,.4);background:rgba(245,185,66,.08)}
.pager{display:flex;gap:6px;justify-content:center;margin-top:12px}
.tsk{display:flex;gap:12px;align-items:flex-start}
.tsk .tico{width:46px;height:46px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--accent2);overflow:hidden;flex:none}
.tsk .tico img{width:100%;height:100%;object-fit:cover}
.evt{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(34,48,71,.45);font-size:12px;align-items:flex-start}
.evt:last-child{border-bottom:none}
.evt .ei{width:28px;height:28px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent2)}
.kvlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.kvitem{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.kvitem b{display:block;font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.kvitem span{font-size:13px;font-weight:700;word-break:break-all}
#sbToggle{display:none}
@media(max-width:860px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:80;transform:translateX(-100%);transition:transform .2s;box-shadow:10px 0 40px rgba(0,0,0,.5)}
  #side.open{transform:translateX(0)}
  #sbToggle{display:inline-flex}
  #content{padding:12px}
  .mbox{padding:14px}
}
</style>
</head>
<body>

<!-- ============ AUTH GATE ============ -->
<div id="auth">
  <div class="authbox">
    <div class="authlogo" id="authLogo"></div>
    <div class="auth-t">DEEPSHAFT <span style="color:var(--accent)">CONTROL</span></div>
    <div class="auth-s">Admin console - full remote control of the mini app</div>
    <label class="lb" style="text-align:left">Admin passcode</label>
    <input class="inp" id="passInput" type="password" placeholder="Enter admin passcode" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn pri block" style="margin-top:14px" id="loginBtn" onclick="doLogin()">Unlock panel</button>
    <div id="authMsg" class="xs" style="color:var(--bad);margin-top:10px;min-height:14px"></div>
    <div class="xs mut" style="margin-top:8px;line-height:1.5">Default passcode: <b class="num">deepshaft2026</b> (change it in Admin &gt; Security after login).<br>The passcode is stored in Firebase and shared by all admins.</div>
  </div>
</div>

<!-- ============ PANEL ============ -->
<div id="panel" class="hide">
  <aside id="side">
    <div class="brand">
      <div class="blogo" id="brandLogo"></div>
      <div class="grow"><b>DEEPSHAFT</b><span class="xs mut">Control Panel</span></div>
    </div>
    <nav id="nav"></nav>
    <div style="padding:10px;border-top:1px solid var(--line)">
      <button class="btn gh block" id="adminWalletBtn" onclick="act('tc-open')"></button>
    </div>
  </aside>
  <div id="main">
    <header id="topbar">
      <button class="btn gh sm" id="sbToggle" onclick="document.getElementById('side').classList.toggle('open')"></button>
      <span class="tt" id="secTitle">Dashboard</span>
      <span class="grow"></span>
      <span class="row xs mut"><span class="onlinedot"></span><span id="onlineCount">0</span>&nbsp;online</span>
      <span class="row xs mut" id="fbState">connecting...</span>
      <button class="btn gh sm" onclick="renderSection(SEC,true)" title="Reload data"></button>
    </header>
    <div id="content"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update, push, increment, remove, onDisconnect, query, limitToLast, orderByChild } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2Ku-RIMgs37TLFO_aU6K88EQmUXpRrWI",

  databaseURL: "https://deep-shaft-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "deep-shaft",
  storageBucket: "deep-shaft.firebasestorage.app",
  messagingSenderId: "172565666879",
  appId: "1:172565666879:web:8cca80ca07b2eef7846c8a",
  measurementId: "G-DTKLJY64FG"
};
const fbApp = initializeApp(firebaseConfig);
const fbDb = getDatabase(fbApp);
window.FB = { db: fbDb, ref, set, get, onValue, update, push, increment, remove, onDisconnect, query, limitToLast, orderByChild, ready: true };
window.dispatchEvent(new Event('firebase-ready'));

<script>
/* ================================================================================================
   DEEPSHAFT CONTROL PANEL (control.html - host next to index.html on the same domain)
  ------------------------------------------------------------------------------------------------
   LIVE CONTROL CHANNELS (Firebase Realtime Database):
     config/app            -> whole app config; index.html reloads it live (themes, tasks, economy...)
     config/admin          -> admin passcode + settings
     users/{tgId}/...      -> profile, state, presence, inbox, taskHistory, payments, withdrawals
     users/{tgId}/inbox    -> one-shot admin commands consumed instantly by the user's app
     users/{tgId}/banned   -> ban flag; watched live by the app (instant ban + instant unban)
     users/{tgId}/unbanned -> persistent whitelist flag set at unban (device re-access allowed)
     bannedUsers/{tgId}    -> ban records with reason; app watches for removal (unban)
     devices/{deviceId}    -> device owner map (multi-account detection; first account stays owner)
     broadcasts/{id}       -> global or targeted announcements with optional image
     payments/{id}         -> TON purchases (verify, refund, flip paid)
     withdrawals/{id}      -> ORE withdrawal queue (manual or AUTO-PAY via TON Connect)
     deposits/{id}         -> user deposit submissions (verify credits ORE)
     events/               -> live activity feed
     taskStats/{id}, taskCompletions/{id}/{uid} -> task completion analytics
   ================================================================================================ */
'use strict';

/* ================= 1. SVG ICON SET (no emoji anywhere) ================= */
const ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  dash:'<path d="M3 13h4l2-8 4 16 2-8h6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M17.5 14.4a6.5 6.5 0 0 1 4 5.6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  pulse:'<path d="M3 12h4l2-7 4 14 2-7h6"/>',
  shield:'<path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/>',

function fmt(n){
  n = Number(n) || 0;
  if (Math.abs(n) < 1000) return (Math.round(n*10)/10).toString();
  const u = ['K','M','B','T','Qa']; let i = -1;
  while (Math.abs(n) >= 1000 && i < u.length-1){ n /= 1000; i++; }
  return (Math.abs(n) >= 100 ? Math.round(n) : Math.round(n*100)/100) + u[i];
}
function fmtTon(n){ return (Math.round((Number(n)||0)*1000)/1000).toString(); }
function shortAddr(a){ a = a||''; return a.length > 16 ? a.slice(0,8)+'...'+a.slice(-6) : a; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function timeAgo(ts){
  if (!ts) return '-';
  const d = Date.now() - ts;
  if (d < 60e3) return Math.max(1,Math.floor(d/1e3)) + 's ago';
  if (d < 3600e3) return Math.floor(d/60e3) + 'm ago';
  if (d < 86400e3) return Math.floor(d/3600e3) + 'h ago';
  return Math.floor(d/86400e3) + 'd ago';
}
function dstr(ts){ return ts ? new Date(ts).toLocaleDateString() : '-'; }

function toast(msg, kind, icon){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind||'');
  t.innerHTML = '<span style="color:' + (kind==='err'?'var(--bad)':kind==='ok'?'var(--good)':kind==='warn'?'var(--warn)':'var(--accent2)') + '">' + I(icon || (kind==='err'?'alert':kind==='ok'?'check':'info')) + '</span><span>' + esc(msg) + '</span>';
  $('#toastRoot').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, 3800);
}
function copyText(t, msg){
  const done = () => toast(msg || 'Copied', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(done);
  else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); done(); }
}

function deepMerge(base, over){
  if (over === undefined || over === null) return base;
  if (Array.isArray(over)) return JSON.parse(JSON.stringify(over));
  if (typeof over === 'object' && typeof base === 'object' && base !== null && !Array.isArray(base)){
    const out = { ...base };
    for (const k in over) out[k] = deepMerge(base[k], over[k]);
    return out;
  }
  return over;
}
function download(name, content, mime){
  const blob = new Blob([content], { type: mime || 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/* Resize an uploaded image to a data URL (keeps Firebase writes small) */
function fileToDataUrl(file, maxSize, cb){
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const sc = Math.min(1, (maxSize||256) / Math.max(w, h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => cb(rd.result);
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ================= 5. DERIVED STATS ================= */
function userOnline(u){
  if (!u) return false;
  if (u.presence && u.presence.online === true) return true;
  return (Date.now() - (u.lastSeen||0)) < 150e3;
}
function userBanned(u){ return BANNED['tg_' + u.tgId] || (u.profile && u.profile.banned === true) || (u.state && u.state.friends && u.state.friends.blockedReferrals === true && BANNED['tg_' + u.tgId]); }
function userList(){
  return Object.keys(USERS).map(k => {
    const u = USERS[k] || {};
    const tgId = k.replace(/^tg_/, '');
    return {
      fbKey: k, tgId: tgId,
      profile: u.profile || {}, state: u.state || {},
      lastSeen: u.lastSeen || (u.profile && u.profile.lastSeen) || 0,
      online: userOnline(u),
      banned: !!(u.banned === true || BANNED[k]),
      banRec: BANNED[k] || null,
      deviceId: u.deviceId || (u.state && u.state.friends && u.state.friends.deviceId) || '',
      inbox: u.inbox || {}
    };
  });
}
function isPurchaser(u){
  const tp = Number(u.profile && u.profile.totalPurchased || 0);
  if (tp > 0) return true;
  const uid = Number(u.tgId)||0;
  return Object.values(PAYMENTS).some(p => Number(p.userId) === uid && p.status !== 'rejected');
}
function userPaidTon(tgId){
  let s = 0;
  Object.values(PAYMENTS).forEach(p => { if (Number(p.userId) === Number(tgId) && p.status !== 'rejected') s += Number(p.amountTon)||0; });
  return s;
}
function stats(){
  const L = userList();
  const now = Date.now();
  const today = dayKey(now);
  const month = today.slice(0, 7);
  const joinedToday = L.filter(u => u.profile.createdAt && dayKey(u.profile.createdAt) === today).length;
  const joinedMonth = L.filter(u => u.profile.createdAt && String(new Date(u.profile.createdAt).toISOString()).slice(0,7) === month).length;
  let ore = 0, gems = 0, mined = 0, purchasedTon = 0;
  L.forEach(u => { ore += Number(u.profile.ore||0); gems += Number(u.profile.gems||0); mined += Number(u.profile.totalMined||0); purchasedTon += Number(u.profile.totalPurchased||0); });
  let depTon = 0, wdTon = 0, revTon = 0, pendingWd = 0, pendingDep = 0, pendingPay = 0, paidPay = 0;
  Object.values(DEPOSITS).forEach(d => { if (d.status !== 'rejected') depTon += Number(d.amountTon)||0; if (d.status === 'pending') pendingDep++; });
  Object.values(WITHDRAWALS).forEach(w => { if (w.status === 'paid') wdTon += Number(w.amountTon)||0; if (w.status === 'pending') pendingWd++; });
  Object.values(PAYMENTS).forEach(p => { if (p.status !== 'rejected') revTon += Number(p.amountTon)||0; if (p.status === 'pending') pendingPay++; if (p.status === 'paid') paidPay++; });
  return {
    total: L.length, online: L.filter(u => u.online).length,
    daily: joinedToday, monthly: joinedMonth,
    purchasers: L.filter(isPurchaser).length,
    banned: Object.keys(BANNED).length,
    ore, gems, mined, purchasedTon,
    depTon, wdTon, revTon, pendingWd, pendingDep, pendingPay, paidPay,
    devices: Object.keys(DEVICES).length
  };
}
function joinsPerDay(days){
  const out = [];
  for (let i = days-1; i >= 0; i--){
    const d = new Date(Date.now() - i*86400e3);
    const k = dayKey(d.getTime());
    const label = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
    out.push({ k, label, joins: 0, revenue: 0, dau: 0 });
  }
  const idx = {}; out.forEach((o,i) => idx[o.k] = i);
  userList().forEach(u => { if (u.profile.createdAt){ const i = idx[dayKey(u.profile.createdAt)]; if (i != null) out[i].joins++; } });
  Object.values(PAYMENTS).forEach(p => { const i = idx[dayKey(p.ts)]; if (i != null && p.status !== 'rejected') out[i].revenue += Number(p.amountTon)||0; });
  Object.values(EVENTS).forEach(e => { if (e.type === 'app_open' || e.type === 'session'){ const i = idx[dayKey(e.ts)]; if (i != null) out[i].dau++; } });
  return out;
}

/* ================= 9. RENDER: USERS ================= */
let U_FILTER = 'all', U_SORT = 'lastSeen', U_SEARCH = '', U_PAGE = 1;
const U_PER = 25;
function filteredUsers(){
  let L = userList();
  if (U_SEARCH){
    const q = U_SEARCH.toLowerCase();
    L = L.filter(u => (u.profile.name||'').toLowerCase().includes(q) || (u.profile.username||'').toLowerCase().includes(q) || String(u.tgId).includes(q));
  }
  if (U_FILTER === 'online') L = L.filter(u => u.online);
  else if (U_FILTER === 'banned') L = L.filter(u => u.banned);
  else if (U_FILTER === 'purchasers') L = L.filter(isPurchaser);
  else if (U_FILTER === 'today') L = L.filter(u => u.profile.createdAt && dayKey(u.profile.createdAt) === dayKey());
  else if (U_FILTER === 'withwd') L = L.filter(u => Object.values(WITHDRAWALS).some(w => Number(w.userId) === Number(u.tgId)));
  else if (U_FILTER === 'nodevice') L = L.filter(u => !u.deviceId);
  const val = u => ({
    lastSeen: u.lastSeen||0, ore: Number(u.profile.ore||0), gems: Number(u.profile.gems||0), level: Number(u.profile.level||1),
    createdAt: u.profile.createdAt||0, name: (u.profile.name||'').toLowerCase(), ton: userPaidTon(u.tgId)
  })[U_SORT] || 0;
  L.sort((a,b) => U_SORT === 'name' ? val(a).localeCompare(val(b)) : val(b) - val(a));
  return L;
}

async function loadReferrals(tgId){
  try{

function sendBroadcast(){
  const t = ($('#bcT')||{}).value || 'Announcement';
  const m = ($('#bcM')||{}).value || '';
  const tgtSel = ($('#bcTarget')||{}).value || 'all';
  if (!m && !BC_IMG){ toast('Write a message or add an image', 'err'); return; }
  let target = 'all';
  if (tgtSel === 'specific'){
    const id = ($('#bcTargetId')||{}).value;
    if (!id){ toast('Enter the Telegram ID', 'err'); return; }
    target = String(id);
    notifyUser(id, t, m, BC_IMG);
    toast('Sent as personal message to ' + id, 'ok', 'send');
    return;
  }
  broadcast({ title: t, msg: m, image: BC_IMG || '', target });
}
function massGrant(){
  const ore = Number(($('#massOre')||{}).value)||0;
  const gem = Number(($('#massGem')||{}).value)||0;
  const who = ($('#massWho')||{}).value || 'all';
  if (!ore && !gem){ toast('Enter an amount', 'err'); return; }
  let L = userList();
  if (who === 'online') L = L.filter(u => u.online);
  if (who === 'purchasers') L = L.filter(isPurchaser);
  confirmBox('Mass grant', 'Send ' + (ore ? fmt(ore) + ' ORE' : '') + (ore&&gem?' + ':'') + (gem ? gem + ' GEM' : '') + ' to ' + L.length + ' users?', 'Send to ' + L.length, () => {
    L.forEach(u => grantUser(u.tgId, { ore, gems: gem }));
    toast('Grant commands queued for ' + L.length + ' users', 'ok', 'gift');
  });
}

function autoPayAll(){
  const pend = Object.keys(WITHDRAWALS).map(k => Object.assign({ id: k }, WITHDRAWALS[k])).filter(w => (w.status||'pending') === 'pending');
  confirmBox('Auto-pay all pending', 'Send ' + pend.length + ' transfers (' + fmtTon(pend.reduce((s,w) => s + (Number(w.amountTon)||0), 0)) + ' TON total) from your admin wallet?', 'Pay all', async () => {
    for (const w of pend){
      try{ await autoPayWd(w.id, true); }catch(e){ toast('Failed: ' + (w.id) + ' - ' + e.message, 'err'); break; }
    }
    renderSection('withdrawals');
  });

async function autoPayWd(id, silent){
  const w = WITHDRAWALS[id] || {};
  if (!TC_WALLET){ toast('Connect your admin TON wallet first', 'err', 'wallet'); await act('tc-open'); return; }
  try{
    const amountNano = BigInt(Math.round((Number(w.amountTon)||0) * 1e9)).toString();
    let payload = null;
    try{
      const { beginCell } = await import('https://cdn.jsdelivr.net/npm/@ton/core@0.57.0/+esm');
      const body = beginCell().storeUint(0, 32).storeStringTail(String('wd_' + id + '_' + w.userId).slice(0, 120)).endCell();
      payload = body.toBoc().toString('base64');
    }catch(e){}
    const msg = { address: w.address, amount: amountNano };
    if (payload) msg.payload = payload;
    const res = await TCUI.sendTransaction({ validUntil: Math.floor(Date.now()/1000) + 600, messages: [msg] }, { requestsModal: true });
    const hash = (res && res.boc ? String(res.boc).slice(0, 64) : '') || ('tonconnect-' + Date.now());
    payWithdrawalManual(w, hash);
    window.FB.update(fbPath('withdrawals/' + id), { method: 'tonconnect-auto' });
    if (!silent){ toast('Paid ' + fmtTon(w.amountTon) + ' TON to ' + shortAddr(w.address), 'ok', 'check'); renderSection('withdrawals'); }
  }catch(e){
    if (!silent) toast('Transfer canceled or failed: ' + (e.message||''), 'err');
    throw e;
  }
}

  + '</div>'
  + '</div>';
};
function publishAdminPass(){
  const pass = ($('#admPass')||{}).value || '';
  if (pass.length < 4){ toast('Passcode too short (min 4 chars)', 'err'); return; }
  window.FB.set(fbPath('config/admin'), { passcode: pass, updatedAt: Date.now() }).then(() => toast('Passcode updated - use it on next login', 'ok', 'key'));
}
/* ================= 20. TON CONNECT (admin wallet for auto-withdraw) ================= */
let TCUI = null, TC_WALLET = null;
function tcSDK(){ return window.TON_CONNECT_UI || window.TonConnectUI || null; }
async function ensurePanelTC(){
  const SDK = tcSDK();
  if (!SDK || !SDK.TonConnectUI){ toast('TON Connect SDK not loaded', 'err'); return null; }
  if (!TCUI){
    let manifest = ((liveCfg().payments||{}).tonconnect||{}).manifestUrl || '';
    if (!manifest || manifest.indexOf('your-domain') !== -1) manifest = location.origin + '/tonconnect-manifest.json';
    TCUI = new SDK.TonConnectUI({ manifestUrl: manifest });
    TCUI.onStatusChange(w => {
      TC_WALLET = w && w.account ? w : null;
      renderNav();
      if (SEC === 'withdrawals') renderSection('withdrawals');
      if (TC_WALLET) toast('Admin wallet connected: ' + shortAddr(TC_WALLET.account.address), 'ok', 'wallet');
    });
    try{ const w = await TCUI.getWallet(); if (w && w.account) TC_WALLET = w; }catch(e){}
  }
  return TCUI;
}
async function panelConnect(){
  const c = await ensurePanelTC();
  if (!c) return;
  try{ await c.openModal(); }catch(e){ toast(e.message||'Wallet modal failed', 'err'); }
}
async function panelDisconnect(){
  try{ if (TCUI) await TCUI.disconnect(); }catch(e){}
  TC_WALLET = null; renderNav();
  toast('Admin wallet disconnected', 'info');
}
/* ================= 21. ACTIONS ================= */
async function act(name){
  if (name === 'tc-open') return panelConnect();
  if (name === 'tc-disconnect') return panelDisconnect();
  toast('Unknown action: ' + name, 'err');
}
/* ================= 22. BOOT ================= */
function boot(){
  // decorative logos + icons in static markup
  $('#authLogo').innerHTML = I('pick','ic-lg');
  $('#brandLogo').innerHTML = I('pick');
  $('#sbToggle').innerHTML = I('menu');
  const rf = $('#topbar').querySelector('button.gh');
  if (rf) rf.innerHTML = I('refresh');
  // session restore
  if (sessionStorage.getItem('cp_admin_ok') === '1'){
    LOGGED_IN = true;
    $('#auth').classList.add('hide');
    $('#panel').classList.remove('hide');
    renderNav(); renderSection('dashboard', true);
  }
  // firebase listeners + passcode prefetch
  const waitFB = () => {
    if (!window.FB || !window.FB.ready){ setTimeout(waitFB, 250); return; }
    startListeners();
    setFbState('live');
    window.FB.get(fbPath('config/admin')).then(s => {
      if (!s.exists()) window.FB.set(fbPath('config/admin'), { passcode: 'deepshaft2026', createdAt: Date.now() });
      ADMIN_CFG = s.exists() ? s.val() : { passcode: 'deepshaft2026' };
    }).catch(() => {});
  };
  waitFB();
  // auto refresh badges every 30s
  setInterval(() => { updateBadges(); }, 30000);
  // refresh wallet chip when SDK arrives late
  let tcTries = 0;
  const tcT = setInterval(() => {
    if (tcSDK() || ++tcT > 40){ clearInterval(tcT); renderNav(); if (tcSDK()) ensurePanelTC(); }
  }, 500);
}
document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();







</script>
